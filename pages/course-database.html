<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程中心 - 灵小犀</title>
  <meta name="description" content="灵小犀叙事评估与干预课程中心">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .main__body{max-width:1320px;padding-bottom:44px}.main__header{max-width:1320px}.stat-grid--four{grid-template-columns:repeat(4,1fr)}
    .selection-banner{display:none;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;color:var(--color-text-primary);background:var(--color-primary-light);border:1px solid rgba(107,155,208,.25);border-radius:var(--radius-lg)}
    .selection-banner.is-visible{display:flex}.selection-banner__copy{display:flex;align-items:center;gap:14px}.selection-banner__icon{width:44px;height:44px;display:grid;place-items:center;color:var(--color-primary);background:#fff;border-radius:14px;font-weight:600}.selection-banner h2{font-size:var(--font-size-base)}.selection-banner p{color:var(--color-text-secondary);font-size:var(--font-size-xs)}
    .flow-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.flow-step{position:relative;padding:15px 16px;background:var(--color-background);border:1px solid transparent;border-radius:var(--radius-md)}.flow-step.is-current{background:var(--color-primary-light);border-color:var(--color-primary)}.flow-step:not(:last-child)::after{content:"→";position:absolute;right:-11px;top:38%;z-index:2;width:22px;height:22px;display:grid;place-items:center;color:var(--color-primary);background:#fff;border-radius:50%;font-size:12px}.flow-step span{display:block;color:var(--color-primary);font-size:var(--font-size-xs);font-weight:600}.flow-step strong{display:block;margin-top:4px;font-size:var(--font-size-sm)}
    .course-toolbar{padding:18px 22px;border-bottom:1px solid var(--color-divider)}.course-toolbar__row{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(150px,.7fr));gap:12px}.course-toolbar select{height:40px;padding:0 34px 0 12px;color:var(--color-text-primary);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);font:inherit;font-size:var(--font-size-sm)}
    .filter-tags{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px}.filter-label{margin-right:4px;color:var(--color-text-secondary);font-size:var(--font-size-xs)}.filter-tag{height:30px;padding:0 12px;color:var(--color-text-secondary);background:var(--color-background);border:1px solid transparent;border-radius:var(--radius-full);font:inherit;font-size:var(--font-size-xs);cursor:pointer}.filter-tag.is-active{color:var(--color-primary);background:var(--color-primary-light);border-color:rgba(107,155,208,.28)}
    .course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:22px}.course-card{display:flex;flex-direction:column;min-height:290px;overflow:hidden;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);transition:transform var(--transition-base),box-shadow var(--transition-base),border-color var(--transition-base)}.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(107,155,208,.5)}
    .course-card__cover{position:relative;height:104px;padding:18px;background:linear-gradient(135deg,var(--cover-a),var(--cover-b));overflow:hidden}.course-card__cover::after{content:attr(data-mark);position:absolute;right:16px;bottom:-24px;color:rgba(255,255,255,.42);font-size:82px;font-weight:600}.course-card__number{position:relative;z-index:1;color:rgba(44,62,80,.55);font-size:var(--font-size-xs)}.course-card__theme{position:relative;z-index:1;display:inline-flex;margin-top:26px;padding:3px 9px;color:var(--color-text-primary);background:rgba(255,255,255,.78);border-radius:var(--radius-full);font-size:var(--font-size-xs)}
    .course-card__body{display:flex;flex:1;flex-direction:column;padding:18px}.course-card__title-row{display:flex;align-items:start;justify-content:space-between;gap:12px}.course-card h3{font-size:var(--font-size-md)}.recommend{flex-shrink:0;color:var(--color-success-dark);font-size:var(--font-size-xs)}.course-card__story{margin:8px 0 14px;color:var(--color-text-secondary);font-size:var(--font-size-xs);line-height:1.7}.meta-line{display:grid;grid-template-columns:56px 1fr;gap:8px;margin-top:5px;font-size:var(--font-size-xs)}.meta-line span:first-child{color:var(--color-text-tertiary)}.meta-line span:last-child{color:var(--color-text-secondary)}.feature-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.feature-chip{padding:3px 8px;color:var(--color-primary);background:var(--color-primary-light);border-radius:var(--radius-full);font-size:11px}.course-card__footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:16px}.course-card__footer small{color:var(--color-text-tertiary)}
    .empty-state{display:none}.empty-state.is-visible{display:flex}.pending-badge{margin-left:6px;padding:2px 6px;color:var(--color-warning-dark);background:var(--color-accent-light);border-radius:var(--radius-full);font-size:10px}.toast{position:fixed;left:50%;bottom:28px;z-index:300;transform:translate(-50%,18px);padding:10px 18px;color:#fff;background:rgba(44,62,80,.92);border-radius:var(--radius-full);opacity:0;pointer-events:none;transition:all var(--transition-base);font-size:var(--font-size-sm)}.toast.is-visible{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1050px){.stat-grid--four{grid-template-columns:repeat(2,1fr)}.course-grid{grid-template-columns:repeat(2,1fr)}.course-toolbar__row{grid-template-columns:1fr 1fr}.flow-strip{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:680px){.main__actions{display:none}.stat-grid--four,.course-grid,.course-toolbar__row,.flow-strip{grid-template-columns:1fr}.course-grid{padding:14px}.selection-banner{align-items:flex-start;flex-direction:column}.flow-step:not(:last-child)::after{display:none}}
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="topnav" aria-label="主导航"><a class="topnav__brand" href="index.html"><div class="topnav__logo">犀</div><span class="topnav__name">灵小犀</span></a><div class="topnav__nav"><a class="topnav__link" href="index.html">工作台</a><a class="topnav__link" href="case-database.html">个案数据库</a><a class="topnav__link is-active" href="course-database.html" aria-current="page">课程中心</a></div><div class="topnav__user"><div class="avatar">U</div><span>管理员</span></div></nav>
    <main class="main">
      <header class="main__header"><div><h1 class="main__title" id="pageTitle">课程中心</h1><p class="main__subtitle" id="pageSubtitle">围绕儿童叙事能力目标管理评估与干预课程</p></div><div class="main__actions"><button class="btn btn--secondary btn--sm" type="button" data-pending>导入课程 <span class="pending-badge">待确认</span></button><button class="btn btn--primary btn--sm" type="button" data-pending>＋ 新增课程 <span class="pending-badge">待确认</span></button></div></header>
      <div class="main__body">
        <section class="selection-banner" id="selectionBanner" aria-live="polite"><div class="selection-banner__copy"><div class="selection-banner__icon">选</div><div><h2>正在为 <span id="caseName">当前个案</span> 选择课程</h2><p>选定后将课程推送至个案名下，并进入本次叙事干预课堂。</p></div></div><a class="btn btn--secondary btn--sm" href="case-database.html">更换个案</a></section>
        <section class="stat-grid stat-grid--four" aria-label="课程概览"><article class="stat-card stat-card--primary"><span class="stat-card__label">故事课程</span><strong class="stat-card__value">18</strong><span class="stat-card__trend">叙事干预课程资源</span></article><article class="stat-card stat-card--secondary"><span class="stat-card__label">叙事评估</span><strong class="stat-card__value">5</strong><span class="stat-card__trend">含录音与结果分析</span></article><article class="stat-card stat-card--accent"><span class="stat-card__label">本周使用</span><strong class="stat-card__value">12</strong><span class="stat-card__trend">覆盖 8 名儿童</span></article><article class="stat-card"><span class="stat-card__label">推荐待确认</span><strong class="stat-card__value">3</strong><span class="stat-card__trend">基于个案分析结果</span></article></section>
        <section class="card" aria-labelledby="flowTitle"><div class="card__header"><div><h2 class="card__title" id="flowTitle">IEP 方案与选课流程</h2><p class="main__subtitle">课程选择完成后，系统将内容推送至个案名下</p></div><span class="tag tag--primary">叙事干预</span></div><div class="card__body"><div class="flow-strip"><div class="flow-step"><span>01</span><strong>分析结果</strong></div><div class="flow-step"><span>02</span><strong>推荐课程</strong></div><div class="flow-step is-current"><span>03</span><strong>课程选择</strong></div><div class="flow-step"><span>04</span><strong>生成并推送</strong></div></div></div></section>
        <section class="card" aria-labelledby="courseListTitle"><div class="card__header"><div><h2 class="card__title" id="courseListTitle">课程项目</h2><p class="main__subtitle">按故事目标、核心问题和课堂功能选择课程</p></div><span class="text-muted" id="resultCount">共 8 门课程</span></div>
          <div class="course-toolbar"><div class="course-toolbar__row"><input class="input" id="searchInput" type="search" placeholder="搜索故事名称、主题或核心问题"><select id="moduleFilter" aria-label="业务模块"><option value="all">全部业务模块</option><option value="叙事干预">叙事干预</option><option value="叙事评估">叙事评估</option></select><select id="goalFilter" aria-label="教学目标"><option value="all">全部教学目标</option><option value="故事语法">故事语法</option><option value="故事理解">故事理解</option><option value="完整叙述">完整叙述</option><option value="情感表达">情感表达</option></select><select id="featureFilter" aria-label="课堂功能"><option value="all">全部课堂功能</option><option value="脚本播放">脚本播放</option><option value="提问与回答">提问与回答</option><option value="图片与图标">图片与图标</option><option value="录音分析">录音分析</option></select></div>
            <div class="filter-tags" role="group" aria-label="主题快捷筛选"><span class="filter-label">故事主题</span><button class="filter-tag is-active" type="button" data-theme="all">全部</button><button class="filter-tag" type="button" data-theme="坚持与毅力">坚持与毅力</button><button class="filter-tag" type="button" data-theme="责任与友谊">责任与友谊</button><button class="filter-tag" type="button" data-theme="勇气与克服恐惧">勇气与克服恐惧</button><button class="filter-tag" type="button" data-theme="合作与表达">合作与表达</button></div>
          </div><div class="course-grid" id="courseGrid" aria-live="polite"></div><div class="empty-state" id="emptyState"><strong>没有找到匹配的课程</strong><span>请调整关键词或筛选条件</span><button class="btn btn--secondary btn--sm" id="resetButton" type="button">清除筛选</button></div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){
      var courses=[
        {id:1,name:'小明的新自行车',theme:'坚持与毅力',problem:'学骑车摔倒了',ending:'学会了骑自行车',module:'叙事干预',goal:'故事语法',features:['脚本播放','提问与回答','图片与图标','录音分析'],summary:'从收到礼物、跌倒受挫到重新尝试，练习完整讲述事件起因、经过与结果。',mark:'车',colors:['#e8f0f8','#dbe8f3'],recommended:true},
        {id:2,name:'小红的小狗丢了',theme:'责任与友谊',problem:'豆豆走丢了',ending:'王阿姨找到了豆豆',module:'叙事干预',goal:'故事理解',features:['脚本播放','提问与回答','录音分析'],summary:'理解人物目标、问题与解决办法，练习回答故事理解问题。',mark:'友',colors:['#e8f5ed','#d9eee2']},
        {id:3,name:'小学学游泳',theme:'勇气与克服恐惧',problem:'害怕水不敢游泳',ending:'学会了游泳',module:'叙事干预',goal:'情感表达',features:['脚本播放','图片与图标','录音分析'],summary:'识别害怕、尝试和成功后的情绪变化，学习表达人物感受。',mark:'勇',colors:['#fcf4e3','#f7e8c7']},
        {id:4,name:'公园里的风筝',theme:'责任与友谊',problem:'风筝卡在树上',ending:'取下风筝成了好朋友',module:'叙事干预',goal:'完整叙述',features:['脚本播放','提问与回答','图片与图标'],summary:'围绕求助与合作组织多角色事件，练习连接词和结局表达。',mark:'筝',colors:['#f9e8e8','#f3dada']},
        {id:5,name:'小美的画画比赛',theme:'合作与表达',problem:'同桌说画得不像',ending:'获得一等奖',module:'叙事评估',goal:'完整叙述',features:['图片与图标','录音分析'],summary:'使用连续图片完成个人讲述，生成转录文本并用于语言样本分析。',mark:'画',colors:['#e9edf6','#dce3f0']},
        {id:6,name:'小熊去露营',theme:'勇气与克服恐惧',problem:'晚上害怕奇怪声音',ending:'克服恐惧喜欢露营',module:'叙事干预',goal:'故事理解',features:['脚本播放','提问与回答','录音分析'],summary:'通过顺序或随机提问检查因果、推理与人物情绪理解。',mark:'营',colors:['#e8f5ed','#d7eadf']},
        {id:7,name:'小强的足球队',theme:'合作与表达',problem:'最好的射手受伤',ending:'赢得了比赛冠军',module:'叙事干预',goal:'故事语法',features:['脚本播放','提问与回答','图片与图标'],summary:'梳理团队目标、阻碍、行动与结果，强化故事语法要素。',mark:'球',colors:['#fcf4e3','#f4e2b9']},
        {id:8,name:'迷路的猫咪',theme:'责任与友谊',problem:'发现迷路的小猫',ending:'找到主人并收到感谢',module:'叙事评估',goal:'情感表达',features:['图片与图标','录音分析'],summary:'看图讲述并完成录音转写，观察情绪词、指代和叙事连贯性。',mark:'猫',colors:['#f9e8e8','#eed7df']}
      ];
      var params=new URLSearchParams(location.search),caseName=params.get('caseName')||'',caseId=params.get('case')||'',selecting=params.get('mode')==='select'||!!caseName,theme='all';
      var grid=document.getElementById('courseGrid'),search=document.getElementById('searchInput'),moduleFilter=document.getElementById('moduleFilter'),goalFilter=document.getElementById('goalFilter'),featureFilter=document.getElementById('featureFilter'),empty=document.getElementById('emptyState'),count=document.getElementById('resultCount');
      if(selecting){document.getElementById('selectionBanner').classList.add('is-visible');document.getElementById('caseName').textContent=caseName||'当前个案';document.getElementById('pageTitle').textContent='为个案选择课程';document.getElementById('pageSubtitle').textContent='确认课程后生成内容并推送至个案名下';}
      var moduleParam=params.get('module');if(moduleParam&&Array.from(moduleFilter.options).some(function(o){return o.value===moduleParam})){moduleFilter.value=moduleParam;}
      function esc(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
      function courseUrl(c){var q=new URLSearchParams({id:c.id,name:c.name});if(caseName)q.set('caseName',caseName);if(caseId)q.set('case',caseId);return 'course-detail.html?'+q.toString()}
      function render(){var keyword=search.value.trim().toLowerCase();var list=courses.filter(function(c){return(!keyword||(c.name+c.theme+c.problem+c.ending+c.summary).toLowerCase().includes(keyword))&&(moduleFilter.value==='all'||c.module===moduleFilter.value)&&(goalFilter.value==='all'||c.goal===goalFilter.value)&&(featureFilter.value==='all'||c.features.includes(featureFilter.value))&&(theme==='all'||c.theme===theme)});count.textContent='共 '+list.length+' 门课程';grid.innerHTML=list.map(function(c,i){return '<article class="course-card"><div class="course-card__cover" data-mark="'+esc(c.mark)+'" style="--cover-a:'+c.colors[0]+';--cover-b:'+c.colors[1]+'"><span class="course-card__number">STORY '+String(c.id).padStart(2,'0')+'</span><span class="course-card__theme">'+esc(c.theme)+'</span></div><div class="course-card__body"><div class="course-card__title-row"><h3>'+esc(c.name)+'</h3>'+(c.recommended?'<span class="recommend">★ 优先推荐</span>':'')+'</div><p class="course-card__story">'+esc(c.summary)+'</p><div class="meta-line"><span>核心问题</span><span>'+esc(c.problem)+'</span></div><div class="meta-line"><span>故事结局</span><span>'+esc(c.ending)+'</span></div><div class="feature-list">'+c.features.map(function(f){return'<span class="feature-chip">'+esc(f)+'</span>'}).join('')+'</div><div class="course-card__footer"><small>'+esc(c.module)+' · '+esc(c.goal)+'</small><a class="btn '+(selecting?'btn--primary':'btn--secondary')+' btn--sm" href="'+courseUrl(c)+'">'+(selecting?'选择并开始':'进入课程')+'</a></div></div></article>'}).join('');grid.style.display=list.length?'grid':'none';empty.classList.toggle('is-visible',!list.length)}
      [search,moduleFilter,goalFilter,featureFilter].forEach(function(el){el.addEventListener(el===search?'input':'change',render)});document.querySelectorAll('[data-theme]').forEach(function(btn){btn.addEventListener('click',function(){theme=btn.dataset.theme;document.querySelectorAll('[data-theme]').forEach(function(b){b.classList.toggle('is-active',b===btn)});render()})});document.getElementById('resetButton').addEventListener('click',function(){search.value='';moduleFilter.value='all';goalFilter.value='all';featureFilter.value='all';theme='all';document.querySelectorAll('[data-theme]').forEach(function(b){b.classList.toggle('is-active',b.dataset.theme==='all')});render()});
      var toast=document.getElementById('toast'),timer;document.querySelectorAll('[data-pending]').forEach(function(btn){btn.addEventListener('click',function(){clearTimeout(timer);toast.textContent='该入口已保留，字段与导入规则待与老师确认';toast.classList.add('is-visible');timer=setTimeout(function(){toast.classList.remove('is-visible')},2600)})});render();
    })();
  </script>
</body>
</html>
