<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2b - 个案详情 - 灵小犀</title>
  <meta name="description" content="个案康复数据与课程记录详情">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* 页面专属样式 */

    .case-header {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-base);
      padding: var(--space-lg) var(--space-xl);
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .case-header__back {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .case-header__back:hover {
      color: var(--color-primary);
    }

    .case-header__info {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-top: var(--space-sm);
    }

    .case-header__name {
      display: flex;
      align-items: center;
      gap: var(--space-base);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    .case-header__meta {
      display: flex;
      align-items: center;
      gap: var(--space-base);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    /* Tab 切换 */
    .tabs {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding: 0 var(--space-xl);
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .tab {
      position: relative;
      padding: var(--space-base) var(--space-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: color var(--transition-fast);
    }

    .tab:hover {
      color: var(--color-text-primary);
    }

    .tab.is-active {
      color: var(--color-primary);
    }

    .tab.is-active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background-color: var(--color-primary);
      border-radius: 2px 2px 0 0;
    }

    /* 统计卡片 */
    .detail-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-base);
      flex-shrink: 0;
    }

    .detail-stat {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      padding: var(--space-base) var(--space-lg);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .detail-stat__value {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      line-height: 1;
    }

    .detail-stat__label {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    /* 技能列表 */
    .skill-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-base);
    }

    .skill-item {
      display: grid;
      grid-template-columns: 28px 80px 1fr 40px;
      align-items: center;
      gap: var(--space-base);
    }

    .skill-item__icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-on-primary);
    }

    .skill-item__name {
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
    }

    .skill-item__bar {
      position: relative;
      height: 8px;
      background-color: var(--color-divider);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .skill-item__progress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background-color: var(--color-primary);
      border-radius: var(--radius-full);
      opacity: 0.85;
    }

    .skill-item__value {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      text-align: right;
    }

    .skill-hint {
      margin-top: var(--space-base);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    /* 空状态 */
    .empty-state--compact {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      font-size: var(--font-size-sm);
      color: var(--color-text-tertiary);
    }

    /* 课次历史 */
    .history-table {
      min-width: 560px;
    }

    .history-table .is-empty {
      text-align: center;
      padding: var(--space-2xl);
    }

    /* 详情页内容分栏：左侧主要内容约占 70%，右侧辅助区 30% */
    .detail-grid {
      grid-template-columns: 1.4fr 0.6fr;
    }

    @media (max-width: 1024px) {
      .detail-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .case-header {
        flex-direction: column;
        align-items: flex-start;
        padding: var(--space-base) var(--space-lg);
      }

      .tabs {
        padding: 0 var(--space-lg);
      }

      .skill-item {
        grid-template-columns: 28px 1fr 40px;
      }

      .skill-item__name {
        grid-column: 2 / -1;
      }

      .skill-item__bar {
        grid-column: 2 / 3;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 顶部导航栏 -->
    <nav class="topnav" role="navigation" aria-label="主导航">
      <div class="topnav__brand">
        <div class="topnav__logo">LOGO</div>
        <span class="topnav__name">灵小犀</span>
      </div>
      <div class="topnav__nav">
        <a class="topnav__link" href="#">
          <svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          工作台
        </a>
        <a class="topnav__link is-active" href="case-database.html" aria-current="page">
          <svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          个案数据库
        </a>
        <a class="topnav__link" href="#">
          <svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          课程中心
        </a>
      </div>
      <div class="topnav__user">
        <div class="avatar">U</div>
        <span>管理员</span>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 个案头部 -->
      <header class="case-header">
        <div>
          <a class="case-header__back" href="case-database.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
            返回个案列表
          </a>
          <div class="case-header__info">
            <h1 class="case-header__name">
              <span>2b</span>
              <span class="tag tag--primary">1 对 1</span>
            </h1>
            <p class="case-header__meta">
              <span>男</span>
              <span>出生：—</span>
              <span>年龄：—</span>
            </p>
          </div>
        </div>
        <button class="btn btn--primary btn--sm" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          开始上课
        </button>
      </header>

      <!-- Tab 切换 -->
      <div class="tabs" role="tablist" aria-label="个案数据分类">
        <button class="tab is-active" role="tab" aria-selected="true" type="button">康复数据平台</button>
        <button class="tab" role="tab" aria-selected="false" type="button">录音与语言样本</button>
      </div>

      <div class="main__body">
        <!-- 统计概览 -->
        <section class="detail-stats" aria-label="学习统计">
          <article class="detail-stat">
            <strong class="detail-stat__value">0</strong>
            <span class="detail-stat__label">累计课时</span>
          </article>
          <article class="detail-stat">
            <strong class="detail-stat__value">0</strong>
            <span class="detail-stat__label">累计回合</span>
          </article>
          <article class="detail-stat">
            <strong class="detail-stat__value">0%</strong>
            <span class="detail-stat__label">独立正确率</span>
          </article>
          <article class="detail-stat">
            <strong class="detail-stat__value">0%</strong>
            <span class="detail-stat__label">含提示正确率</span>
          </article>
        </section>

        <!-- 两栏内容 -->
        <div class="content-grid detail-grid">
          <!-- 左侧：故事语法要素掌握 -->
          <section class="card" aria-labelledby="skill-title">
            <div class="card__header">
              <h2 class="card__title" id="skill-title">故事语法要素掌握（独立正确率）</h2>
            </div>
            <div class="card__body">
              <div class="skill-list">
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-primary);">人</span>
                  <span class="skill-item__name">人物</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-secondary-dark);">场</span>
                  <span class="skill-item__name">场景</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-error-dark);">问</span>
                  <span class="skill-item__name">问题</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-accent-dark);">感</span>
                  <span class="skill-item__name">感受</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-info-dark);">计</span>
                  <span class="skill-item__name">计划</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-success-dark);">行</span>
                  <span class="skill-item__name">行动</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-warning-dark);">果</span>
                  <span class="skill-item__name">结果</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-info);">局</span>
                  <span class="skill-item__name">结局</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
                <div class="skill-item">
                  <span class="skill-item__icon" style="background-color: var(--color-primary-hover);">情</span>
                  <span class="skill-item__name">结局感受</span>
                  <div class="skill-item__bar"><span class="skill-item__progress" style="width: 0%;"></span></div>
                  <span class="skill-item__value">0%</span>
                </div>
              </div>
              <p class="skill-hint">暂无数据，上课记录后自动生成。</p>
            </div>
          </section>

          <!-- 右侧：分课程掌握情况 -->
          <section class="card" aria-labelledby="course-title">
            <div class="card__header">
              <h2 class="card__title" id="course-title">分课程掌握情况</h2>
            </div>
            <div class="card__body">
              <div class="empty-state--compact">暂无数据</div>
            </div>
          </section>
        </div>

        <!-- 课次历史 -->
        <section class="card table-card" aria-labelledby="history-title">
          <div class="card__header">
            <h2 class="card__title" id="history-title">课次历史</h2>
          </div>
          <div class="card__body case-table-wrapper">
            <table class="table history-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>课程</th>
                  <th>形式</th>
                  <th>回合数</th>
                  <th>独立正确率</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5" class="text-muted is-empty">还没有上课记录</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
