<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程编辑 - 灵小犀</title>
  <meta name="description" content="灵小犀课程内容编辑与预览">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body { overflow-x: hidden; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--color-primary-light); outline-offset: 2px; }
    .topnav__brand { cursor: pointer; }
    .course-main { width: 100%; max-width: 1440px; margin: 0 auto; padding: var(--space-lg) var(--space-xl) var(--space-2xl); }
    .course-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-lg); margin-bottom: var(--space-lg); }
    .course-head__left { min-width: 0; display: flex; align-items: center; gap: var(--space-base); }
    .back-button { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; color: var(--color-text-secondary); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--font-size-lg); }
    .back-button:hover { color: var(--color-primary); background: var(--color-primary-light); }
    .course-head__copy { min-width: 0; }
    .course-head__title-row { display: flex; align-items: center; gap: var(--space-sm); }
    .course-head__title { overflow: hidden; font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); text-overflow: ellipsis; white-space: nowrap; }
    .course-head__meta { margin-top: 2px; font-size: var(--font-size-xs); color: var(--color-text-secondary); }
    .course-head__actions { display: flex; align-items: center; gap: var(--space-sm); flex-shrink: 0; }
    .status-badge { display: inline-flex; align-items: center; padding: 2px var(--space-sm); color: var(--color-primary); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); background: var(--color-primary-light); border-radius: var(--radius-full); }
    .status-badge.is-published { color: var(--color-success-dark); background: var(--color-secondary-light); }

    .editor-grid { display: grid; grid-template-columns: 224px minmax(0, 1fr) 284px; gap: var(--space-lg); align-items: start; }
    .editor-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .editor-panel__header { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--color-divider); }
    .editor-panel__title { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
    .editor-panel__count { font-size: var(--font-size-xs); color: var(--color-text-tertiary); }

    .slide-list { max-height: calc(100vh - 240px); min-height: 520px; overflow-y: auto; padding: var(--space-sm); }
    .slide-item { position: relative; width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: var(--space-sm); padding: var(--space-sm); color: var(--color-text-secondary); text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; transition: background-color var(--transition-fast), border-color var(--transition-fast); }
    .slide-item + .slide-item { margin-top: var(--space-xs); }
    .slide-item:hover { background: var(--color-background); }
    .slide-item.is-active { color: var(--color-primary); background: var(--color-primary-light); border-color: rgba(107,155,208,.28); }
    .slide-item__number { width: 24px; height: 24px; display: grid; place-items: center; font-size: 11px; font-weight: var(--font-weight-semibold); background: var(--color-surface); border-radius: 7px; box-shadow: var(--shadow-sm); }
    .slide-item__preview { position: relative; height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow: hidden; background: var(--color-background); border-radius: var(--radius-sm); }
    .slide-item.is-active .slide-item__preview { background: var(--color-surface); }
    .slide-item__preview strong { max-width: 100%; overflow: hidden; padding: 0 var(--space-sm); color: var(--color-text-primary); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .slide-item__preview span { font-size: 10px; color: var(--color-text-tertiary); }
    .slide-item__actions { position: absolute; right: 6px; top: 6px; display: none; gap: 2px; }
    .slide-item:hover .slide-item__actions, .slide-item:focus-within .slide-item__actions { display: flex; }
    .slide-mini-button { width: 24px; height: 24px; display: grid; place-items: center; color: var(--color-text-secondary); background: rgba(255,255,255,.92); border: 0; border-radius: 6px; cursor: pointer; box-shadow: var(--shadow-sm); }
    .slide-mini-button:hover { color: var(--color-primary); }
    .slide-mini-button.is-danger:hover { color: var(--color-error); background: var(--color-error-light); }

    .stage-panel { min-width: 0; }
    .stage-toolbar { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-base); padding: var(--space-sm) var(--space-base); border-bottom: 1px solid var(--color-divider); }
    .device-switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--color-background); border-radius: var(--radius-sm); }
    .device-button { height: 28px; padding: 0 var(--space-md); color: var(--color-text-secondary); font-size: var(--font-size-xs); background: transparent; border: 0; border-radius: 6px; cursor: pointer; }
    .device-button.is-active { color: var(--color-primary); background: var(--color-surface); box-shadow: var(--shadow-sm); }
    .stage-hint { font-size: var(--font-size-xs); color: var(--color-text-tertiary); }
    .stage-viewport { min-height: 528px; display: flex; align-items: center; justify-content: center; padding: var(--space-xl); overflow: auto; background: var(--color-background); }
    .lesson-canvas { width: min(100%, 760px); aspect-ratio: 16 / 9; position: relative; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: clamp(24px, 5vw, 64px); background: var(--color-primary-light); border: 1px solid rgba(107,155,208,.15); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); transition: width var(--transition-base), background-color var(--transition-base); }
    .lesson-canvas[data-device="tablet"] { width: min(76%, 560px); aspect-ratio: 4 / 3; }
    .lesson-canvas[data-device="mobile"] { width: min(48%, 330px); aspect-ratio: 9 / 16; padding: var(--space-xl); }
    .lesson-canvas[data-theme="green"] { background: var(--color-secondary-light); border-color: rgba(125,184,154,.2); }
    .lesson-canvas[data-theme="yellow"] { background: var(--color-accent-light); border-color: rgba(226,184,111,.2); }
    .lesson-canvas[data-theme="white"] { background: var(--color-surface); border-color: var(--color-border); }
    .canvas-decor { position: absolute; width: 220px; height: 220px; border: 1px solid rgba(255,255,255,.7); border-radius: var(--radius-full); pointer-events: none; }
    .canvas-decor--one { top: -100px; right: -60px; }
    .canvas-decor--two { bottom: -140px; left: -70px; }
    .canvas-kicker { position: relative; align-self: flex-start; margin-bottom: var(--space-base); padding: 3px var(--space-sm); color: var(--color-primary); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); background: rgba(255,255,255,.76); border-radius: var(--radius-full); }
    .canvas-title { position: relative; max-width: 620px; font-size: clamp(24px, 4vw, 42px); font-weight: var(--font-weight-semibold); line-height: var(--line-height-tight); color: var(--color-text-primary); }
    .lesson-canvas[data-device="mobile"] .canvas-title { font-size: 26px; }
    .canvas-subtitle { position: relative; max-width: 560px; margin-top: var(--space-md); font-size: clamp(13px, 1.8vw, 17px); color: var(--color-text-secondary); }
    .canvas-components { position: relative; display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xl); }
    .canvas-component { display: inline-flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); color: var(--color-text-secondary); font-size: var(--font-size-xs); background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.9); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .canvas-component button { width: 18px; height: 18px; display: grid; place-items: center; color: var(--color-text-tertiary); background: transparent; border: 0; border-radius: var(--radius-full); cursor: pointer; }
    .canvas-component button:hover { color: var(--color-error); background: var(--color-error-light); }

    .player-bar { display: grid; grid-template-columns: auto minmax(120px,1fr) auto auto auto; align-items: center; gap: var(--space-sm); padding: var(--space-md) var(--space-base); border-top: 1px solid var(--color-divider); }
    .player-button { width: 34px; height: 34px; display: grid; place-items: center; color: var(--color-text-secondary); background: var(--color-background); border: 0; border-radius: var(--radius-sm); cursor: pointer; }
    .player-button:hover { color: var(--color-primary); background: var(--color-primary-light); }
    .player-button--primary { color: var(--color-text-on-primary); background: var(--color-primary); }
    .player-button--primary:hover { color: var(--color-text-on-primary); background: var(--color-primary-hover); }
    .progress-range { width: 100%; accent-color: var(--color-primary); cursor: pointer; }
    .player-time { min-width: 76px; font-size: var(--font-size-xs); color: var(--color-text-secondary); text-align: center; }

    .inspector-tabs { display: grid; grid-template-columns: repeat(3,1fr); border-bottom: 1px solid var(--color-divider); }
    .inspector-tab { height: 44px; color: var(--color-text-secondary); font-size: var(--font-size-xs); background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; }
    .inspector-tab.is-active { color: var(--color-primary); font-weight: var(--font-weight-medium); border-bottom-color: var(--color-primary); }
    .inspector-body { max-height: calc(100vh - 240px); min-height: 528px; overflow-y: auto; padding: var(--space-base); }
    .inspector-pane { display: none; }
    .inspector-pane.is-active { display: block; }
    .inspector-section + .inspector-section { margin-top: var(--space-lg); padding-top: var(--space-lg); border-top: 1px solid var(--color-divider); }
    .inspector-section__title { display: block; margin-bottom: var(--space-sm); font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); color: var(--color-text-primary); }
    .inspector-field { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
    .inspector-field label { font-size: 11px; color: var(--color-text-secondary); }
    .inspector-field .input { height: 36px; font-size: var(--font-size-xs); }
    .inspector-field textarea.input { min-height: 72px; height: auto; padding: var(--space-sm); }
    .component-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
    .component-button { min-height: 62px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: var(--space-sm) var(--space-md); color: var(--color-text-secondary); background: var(--color-background); border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; }
    .component-button:hover { color: var(--color-primary); background: var(--color-primary-light); border-color: rgba(107,155,208,.24); }
    .component-button strong { font-size: var(--font-size-xs); }
    .component-button span { font-size: 10px; color: var(--color-text-tertiary); }
    .theme-options { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--space-sm); }
    .theme-button { height: 42px; position: relative; background: var(--color-primary-light); border: 2px solid transparent; border-radius: var(--radius-sm); cursor: pointer; }
    .theme-button[data-theme="green"] { background: var(--color-secondary-light); }
    .theme-button[data-theme="yellow"] { background: var(--color-accent-light); }
    .theme-button[data-theme="white"] { background: var(--color-surface); border-color: var(--color-border); }
    .theme-button.is-active::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--color-primary); font-weight: var(--font-weight-semibold); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); padding: var(--space-sm) 0; }
    .setting-row__copy strong { display: block; font-size: var(--font-size-xs); color: var(--color-text-primary); }
    .setting-row__copy span { display: block; margin-top: 2px; font-size: 10px; color: var(--color-text-tertiary); }
    .switch { position: relative; width: 40px; height: 24px; flex-shrink: 0; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; }
    .switch__track { position: absolute; inset: 0; background: var(--color-border); border-radius: var(--radius-full); transition: background-color var(--transition-fast); }
    .switch__track::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: var(--color-surface); border-radius: var(--radius-full); box-shadow: var(--shadow-sm); transition: transform var(--transition-fast); }
    .switch input:checked + .switch__track { background: var(--color-primary); }
    .switch input:checked + .switch__track::after { transform: translateX(16px); }

    .preview-shell { width: min(100%, 820px); }
    .preview-stage { position: relative; aspect-ratio: 16 / 9; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: var(--space-2xl); background: var(--color-primary-light); border-radius: var(--radius-lg); }
    .preview-stage h3 { position: relative; font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
    .preview-stage p { position: relative; margin-top: var(--space-base); color: var(--color-text-secondary); }
    .preview-controls { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-base); }
    .publish-options { display: flex; flex-direction: column; gap: var(--space-sm); }
    .publish-option { display: flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-md); border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; }
    .publish-option:hover { border-color: var(--color-primary); background: var(--color-primary-light); }
    .publish-option input { margin-top: 3px; accent-color: var(--color-primary); }
    .publish-option strong { display: block; font-size: var(--font-size-sm); }
    .publish-option span { display: block; margin-top: 2px; font-size: var(--font-size-xs); color: var(--color-text-secondary); }
    .confirm-copy { font-size: var(--font-size-sm); color: var(--color-text-primary); }
    .toast { position: fixed; left: 50%; bottom: var(--space-xl); z-index: 340; max-width: calc(100vw - 32px); padding: var(--space-md) var(--space-lg); color: var(--color-text-on-primary); font-size: var(--font-size-sm); background: rgba(44,62,80,.94); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transform: translate(-50%,12px); transition: opacity var(--transition-base), transform var(--transition-base); }
    .toast.is-visible { opacity: 1; transform: translate(-50%,0); }

    @media (max-width: 1180px) {
      .editor-grid { grid-template-columns: 210px minmax(0,1fr); }
      .inspector-panel { grid-column: 1 / -1; }
      .inspector-body { min-height: 0; max-height: none; }
      .component-grid { grid-template-columns: repeat(4,1fr); }
    }
    @media (max-width: 820px) {
      .course-main { padding: var(--space-base); }
      .course-head { align-items: flex-start; flex-direction: column; }
      .course-head__actions { width: 100%; flex-wrap: wrap; }
      .course-head__actions .btn { flex: 1; }
      .editor-grid { grid-template-columns: 1fr; }
      .slide-list { min-height: 0; max-height: 260px; display: grid; grid-template-columns: repeat(2,1fr); gap: var(--space-xs); }
      .slide-item + .slide-item { margin-top: 0; }
      .stage-viewport { min-height: 430px; padding: var(--space-base); }
      .lesson-canvas[data-device="mobile"] { width: min(72%,330px); }
      .component-grid { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 560px) {
      .course-head__title { font-size: var(--font-size-lg); }
      .course-head__actions { display: grid; grid-template-columns: 1fr 1fr; }
      .course-head__actions .btn--primary { grid-column: 1 / -1; }
      .stage-toolbar { align-items: flex-start; flex-direction: column; }
      .stage-viewport { min-height: 380px; }
      .lesson-canvas { padding: var(--space-lg); }
      .lesson-canvas[data-device="tablet"] { width: 92%; }
      .lesson-canvas[data-device="mobile"] { width: min(78%,280px); }
      .canvas-title { font-size: 24px; }
      .canvas-components { margin-top: var(--space-base); }
      .player-bar { grid-template-columns: auto 1fr auto; }
      .player-time { grid-column: 2; grid-row: 2; }
      .player-button[data-action="mute"] { grid-column: 3; grid-row: 1; }
      .player-button[data-action="restart"] { grid-column: 1; grid-row: 2; }
      .slide-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="topnav" role="navigation" aria-label="主导航">
      <a class="topnav__brand" href="index.html" aria-label="返回灵小犀工作台"><div class="topnav__logo">LOGO</div><span class="topnav__name">灵小犀</span></a>
      <div class="topnav__nav">
        <a class="topnav__link" href="index.html"><svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>工作台</a>
        <a class="topnav__link" href="case-database.html"><svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>个案数据库</a>
        <a class="topnav__link is-active" href="course-database.html" aria-current="page"><svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>课程中心</a>
      </div>
      <div class="topnav__user"><div class="avatar">U</div><span>管理员</span></div>
    </nav>

    <main class="course-main">
      <header class="course-head">
        <div class="course-head__left">
          <a class="back-button" href="course-database.html" aria-label="返回课程列表">←</a>
          <div class="course-head__copy">
            <div class="course-head__title-row"><h1 class="course-head__title" id="courseTitle">语音意识训练课程</h1><span class="status-badge" id="courseStatus">草稿</span></div>
            <p class="course-head__meta"><span id="saveStatus">所有更改已保存</span> · <span id="slideSummary">8 个页面</span></p>
          </div>
        </div>
        <div class="course-head__actions">
          <button class="btn btn--secondary btn--sm" type="button" id="saveButton">保存</button>
          <button class="btn btn--secondary btn--sm" type="button" id="previewButton">预览课程</button>
          <button class="btn btn--primary btn--sm" type="button" id="publishButton">发布课程</button>
        </div>
      </header>

      <div class="editor-grid">
        <aside class="editor-panel" aria-labelledby="slideListTitle">
          <div class="editor-panel__header"><div><h2 class="editor-panel__title" id="slideListTitle">课程页面</h2><span class="editor-panel__count" id="slideCount">共 8 页</span></div><button class="btn btn--ghost btn--sm" type="button" id="addSlideButton">＋ 添加</button></div>
          <div class="slide-list" id="slideList"></div>
        </aside>

        <section class="editor-panel stage-panel" aria-labelledby="stageTitle">
          <div class="stage-toolbar">
            <div><h2 class="editor-panel__title" id="stageTitle">页面画布</h2><span class="stage-hint">右侧可编辑内容与样式</span></div>
            <div class="device-switch" role="group" aria-label="预览设备"><button class="device-button is-active" type="button" data-device="desktop">桌面</button><button class="device-button" type="button" data-device="tablet">平板</button><button class="device-button" type="button" data-device="mobile">手机</button></div>
          </div>
          <div class="stage-viewport">
            <div class="lesson-canvas" id="lessonCanvas" data-device="desktop" data-theme="blue">
              <span class="canvas-decor canvas-decor--one"></span><span class="canvas-decor canvas-decor--two"></span>
              <span class="canvas-kicker" id="canvasKicker">第 1 页 · 课程导入</span>
              <h2 class="canvas-title" id="canvasTitle">听一听，找出相同的开头音</h2>
              <p class="canvas-subtitle" id="canvasSubtitle">跟随老师示范，先听词语，再判断它们的开头音是否相同。</p>
              <div class="canvas-components" id="canvasComponents"><span class="canvas-component" data-component="示范音频">示范音频<button type="button" aria-label="移除示范音频">×</button></span><span class="canvas-component" data-component="互动选择题">互动选择题<button type="button" aria-label="移除互动选择题">×</button></span></div>
            </div>
          </div>
          <div class="player-bar" aria-label="课程播放控制">
            <button class="player-button player-button--primary" type="button" id="playButton" aria-label="播放">▶</button>
            <input class="progress-range" id="progressRange" type="range" min="0" max="100" value="0" aria-label="播放进度">
            <span class="player-time" id="playerTime">00:00 / 00:30</span>
            <button class="player-button" type="button" data-action="mute" id="muteButton" aria-label="静音">声</button>
            <button class="player-button" type="button" data-action="restart" id="restartButton" aria-label="重新播放">↺</button>
          </div>
        </section>

        <aside class="editor-panel inspector-panel" aria-labelledby="inspectorTitle">
          <h2 id="inspectorTitle" class="text-muted" style="position:absolute;width:1px;height:1px;overflow:hidden">编辑属性</h2>
          <div class="inspector-tabs" role="tablist"><button class="inspector-tab is-active" type="button" role="tab" aria-selected="true" data-pane="content">内容</button><button class="inspector-tab" type="button" role="tab" aria-selected="false" data-pane="style">样式</button><button class="inspector-tab" type="button" role="tab" aria-selected="false" data-pane="settings">设置</button></div>
          <div class="inspector-body">
            <div class="inspector-pane is-active" id="pane-content">
              <section class="inspector-section"><span class="inspector-section__title">页面文字</span>
                <div class="inspector-field"><label for="titleInput">主标题</label><textarea class="input" id="titleInput" maxlength="60">听一听，找出相同的开头音</textarea></div>
                <div class="inspector-field"><label for="subtitleInput">说明文字</label><textarea class="input" id="subtitleInput" maxlength="100">跟随老师示范，先听词语，再判断它们的开头音是否相同。</textarea></div>
              </section>
              <section class="inspector-section"><span class="inspector-section__title">添加内容组件</span><div class="component-grid">
                <button class="component-button" type="button" data-component="文本提示"><strong>文本提示</strong><span>说明与引导</span></button>
                <button class="component-button" type="button" data-component="示范音频"><strong>示范音频</strong><span>播放与跟读</span></button>
                <button class="component-button" type="button" data-component="教学视频"><strong>教学视频</strong><span>示范动作</span></button>
                <button class="component-button" type="button" data-component="互动选择题"><strong>互动选择</strong><span>即时判断</span></button>
                <button class="component-button" type="button" data-component="语音录制"><strong>语音录制</strong><span>保存样本</span></button>
                <button class="component-button" type="button" data-component="图片卡片"><strong>图片卡片</strong><span>视觉提示</span></button>
              </div></section>
            </div>
            <div class="inspector-pane" id="pane-style">
              <section class="inspector-section"><span class="inspector-section__title">页面主题</span><div class="theme-options"><button class="theme-button is-active" type="button" data-theme="blue" aria-label="浅蓝主题"></button><button class="theme-button" type="button" data-theme="green" aria-label="薄荷绿主题"></button><button class="theme-button" type="button" data-theme="yellow" aria-label="柔和黄主题"></button><button class="theme-button" type="button" data-theme="white" aria-label="白色主题"></button></div></section>
              <section class="inspector-section"><span class="inspector-section__title">文字大小</span><div class="inspector-field"><label for="fontSizeRange">标题字号 <span id="fontSizeValue">42</span>px</label><input class="progress-range" id="fontSizeRange" type="range" min="28" max="54" value="42"></div></section>
              <section class="inspector-section"><span class="inspector-section__title">内容对齐</span><div class="device-switch" style="width:100%;display:grid;grid-template-columns:repeat(3,1fr)"><button class="device-button is-active" type="button" data-align="left">左对齐</button><button class="device-button" type="button" data-align="center">居中</button><button class="device-button" type="button" data-align="right">右对齐</button></div></section>
            </div>
            <div class="inspector-pane" id="pane-settings">
              <section class="inspector-section"><span class="inspector-section__title">播放设置</span>
                <label class="setting-row"><span class="setting-row__copy"><strong>自动播放</strong><span>进入页面后自动开始</span></span><span class="switch"><input type="checkbox" data-setting="自动播放"><span class="switch__track"></span></span></label>
                <label class="setting-row"><span class="setting-row__copy"><strong>显示字幕</strong><span>播放时展示辅助文字</span></span><span class="switch"><input type="checkbox" checked data-setting="显示字幕"><span class="switch__track"></span></span></label>
                <label class="setting-row"><span class="setting-row__copy"><strong>完成后自动翻页</strong><span>适合连续课堂展示</span></span><span class="switch"><input type="checkbox" data-setting="自动翻页"><span class="switch__track"></span></span></label>
              </section>
              <section class="inspector-section"><span class="inspector-section__title">页面时长</span><div class="inspector-field"><label for="durationInput">建议停留时间（秒）</label><input class="input" id="durationInput" type="number" min="5" max="300" value="30"></div></section>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal__container" style="max-width:940px">
      <div class="modal__header"><div><h2 class="modal__title" id="previewTitle">课程预览</h2><p class="main__subtitle">学习者视角 · 当前页面</p></div><button class="modal__close" type="button" aria-label="关闭" data-close-modal="previewModal">×</button></div>
      <div class="modal__body" style="background:var(--color-background)"><div class="preview-shell"><div class="preview-stage" id="previewStage"><span class="canvas-decor canvas-decor--one"></span><h3 id="previewHeading"></h3><p id="previewDescription"></p></div><div class="preview-controls"><button class="btn btn--primary btn--sm" type="button" id="previewPlayButton">▶ 开始播放</button><span class="main__subtitle" id="previewProgressText">页面 1 / 8</span></div></div></div>
      <div class="modal__footer"><button class="btn btn--secondary btn--sm" type="button" data-close-modal="previewModal">结束预览</button></div>
    </div>
  </div>

  <div class="modal" id="publishModal" role="dialog" aria-modal="true" aria-labelledby="publishTitle">
    <div class="modal__container" style="max-width:500px">
      <div class="modal__header"><h2 class="modal__title" id="publishTitle">发布课程</h2><button class="modal__close" type="button" aria-label="关闭" data-close-modal="publishModal">×</button></div>
      <div class="modal__body"><p class="main__subtitle" style="margin-bottom:var(--space-base)">请选择课程的使用范围，发布后仍可继续编辑。</p><div class="publish-options">
        <label class="publish-option"><input type="radio" name="publishScope" value="机构内" checked><span><strong>机构内可见</strong><span>本机构教师可查看并用于课堂</span></span></label>
        <label class="publish-option"><input type="radio" name="publishScope" value="仅指定小组"><span><strong>仅指定小组</strong><span>发布后再选择适用的干预小组</span></span></label>
        <label class="publish-option"><input type="radio" name="publishScope" value="仅自己"><span><strong>仅自己可见</strong><span>作为个人课程保存</span></span></label>
      </div></div>
      <div class="modal__footer"><button class="btn btn--secondary btn--sm" type="button" data-close-modal="publishModal">取消</button><button class="btn btn--primary btn--sm" type="button" id="confirmPublishButton">确认发布</button></div>
    </div>
  </div>

  <div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal__container" style="max-width:420px"><div class="modal__header"><h2 class="modal__title" id="confirmTitle">删除页面</h2><button class="modal__close" type="button" aria-label="关闭" data-close-modal="confirmModal">×</button></div><div class="modal__body"><p class="confirm-copy" id="confirmCopy"></p></div><div class="modal__footer"><button class="btn btn--secondary btn--sm" type="button" data-close-modal="confirmModal">取消</button><button class="btn btn--danger btn--sm" type="button" id="confirmAction">删除</button></div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    let slides = [
      { id: 1, title: '听一听，找出相同的开头音', type: '课程导入', subtitle: '跟随老师示范，先听词语，再判断它们的开头音是否相同。', theme: 'blue', components: ['示范音频','互动选择题'] },
      { id: 2, title: '认识声音的开头', type: '视频讲解', subtitle: '观察口型，听清每个词语最前面的声音。', theme: 'green', components: ['教学视频','文本提示'] },
      { id: 3, title: '苹果和阿姨', type: '互动练习', subtitle: '点击播放后，选出和“苹果”开头音相同的词语。', theme: 'yellow', components: ['示范音频','图片卡片','互动选择题'] },
      { id: 4, title: '跟我读一读', type: '语音跟读', subtitle: '按住录音按钮，清楚地读出屏幕上的词语。', theme: 'blue', components: ['语音录制','图片卡片'] },
      { id: 5, title: '找出不一样的声音', type: '互动练习', subtitle: '认真听三组词语，找出开头音不同的一项。', theme: 'green', components: ['示范音频','互动选择题'] },
      { id: 6, title: '快速挑战', type: '巩固练习', subtitle: '在规定时间内完成 5 道开头音判断题。', theme: 'yellow', components: ['互动选择题','文本提示'] },
      { id: 7, title: '今天我学会了', type: '课堂总结', subtitle: '回顾今天的练习，说说你发现了什么。', theme: 'blue', components: ['文本提示','语音录制'] },
      { id: 8, title: '家庭练习', type: '课后任务', subtitle: '和家长一起找出 5 个开头音相同的词语。', theme: 'white', components: ['文本提示','图片卡片'] }
    ];
    let activeSlideId = 1;
    let playing = false;
    let muted = false;
    let progress = 0;
    let playTimer = null;
    let toastTimer = null;
    let confirmCallback = null;
    let dirty = false;
    const lessonCanvas = document.getElementById('lessonCanvas');
    const progressRange = document.getElementById('progressRange');

    function getActiveSlide() { return slides.find(function (slide) { return slide.id === activeSlideId; }); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, function (char) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]; }); }
    function showToast(message) { const toast = document.getElementById('toast'); clearTimeout(toastTimer); toast.textContent = message; toast.classList.add('is-visible'); toastTimer = setTimeout(function () { toast.classList.remove('is-visible'); }, 2400); }
    function markDirty() { dirty = true; document.getElementById('saveStatus').textContent = '有未保存的更改'; }
    function openModal(id) { const modal = document.getElementById(id); modal.classList.add('is-open'); requestAnimationFrame(function () { modal.classList.add('is-visible'); }); document.body.style.overflow = 'hidden'; const first = modal.querySelector('button,input'); if (first) setTimeout(function () { first.focus(); }, 50); }
    function closeModal(id) { const modal = document.getElementById(id); modal.classList.remove('is-visible'); setTimeout(function () { modal.classList.remove('is-open'); if (!document.querySelector('.modal.is-open')) document.body.style.overflow = ''; }, 200); }
    function formatTime(seconds) { const safe = Math.max(0, Math.round(seconds)); return String(Math.floor(safe / 60)).padStart(2,'0') + ':' + String(safe % 60).padStart(2,'0'); }
    function updateTime() { const duration = Number(document.getElementById('durationInput').value) || 30; document.getElementById('playerTime').textContent = formatTime(duration * progress / 100) + ' / ' + formatTime(duration); }
    function stopPlayback(reset) { playing = false; clearInterval(playTimer); playTimer = null; document.getElementById('playButton').textContent = '▶'; document.getElementById('playButton').setAttribute('aria-label','播放'); if (reset) { progress = 0; progressRange.value = 0; updateTime(); } }
    function settingEnabled(name) { const input = document.querySelector('[data-setting="' + name + '"]'); return Boolean(input && input.checked); }
    function startPlayback() {
      if (progress >= 100) { progress = 0; progressRange.value = 0; }
      playing = true; document.getElementById('playButton').textContent = 'Ⅱ'; document.getElementById('playButton').setAttribute('aria-label','暂停'); clearInterval(playTimer);
      playTimer = setInterval(function () {
        const duration = Number(document.getElementById('durationInput').value) || 30;
        progress = Math.min(100, progress + 100 / (duration * 10)); progressRange.value = progress; updateTime();
        if (progress >= 100) {
          stopPlayback(false);
          const currentIndex = slides.findIndex(function (slide) { return slide.id === activeSlideId; });
          if (settingEnabled('自动翻页') && currentIndex < slides.length - 1) {
            activeSlideId = slides[currentIndex + 1].id; renderSlides(); renderActiveSlide(); stopPlayback(true); showToast('已自动进入下一页');
            if (settingEnabled('自动播放')) setTimeout(startPlayback, 300);
          } else {
            showToast('当前页面播放完成');
          }
        }
      }, 100);
    }
    function togglePlayback() { if (playing) { stopPlayback(false); showToast('已暂停播放'); } else { startPlayback(); } }
    function renderSlides() {
      const list = document.getElementById('slideList');
      list.innerHTML = slides.map(function (slide,index) {
        return '<div class="slide-item ' + (slide.id === activeSlideId ? 'is-active' : '') + '" role="button" tabindex="0" data-id="' + slide.id + '"><span class="slide-item__number">' + (index+1) + '</span><span class="slide-item__preview"><strong>' + escapeHtml(slide.title) + '</strong><span>' + escapeHtml(slide.type) + '</span></span><span class="slide-item__actions"><button class="slide-mini-button" type="button" data-action="duplicate" aria-label="复制页面">＋</button><button class="slide-mini-button is-danger" type="button" data-action="delete" aria-label="删除页面">×</button></span></div>';
      }).join('');
      document.getElementById('slideCount').textContent = '共 ' + slides.length + ' 页'; document.getElementById('slideSummary').textContent = slides.length + ' 个页面'; document.getElementById('previewProgressText').textContent = '页面 ' + (slides.findIndex(function (slide) { return slide.id === activeSlideId; }) + 1) + ' / ' + slides.length;
      list.querySelectorAll('.slide-item').forEach(function (item) {
        item.addEventListener('click', function (event) { const id = Number(item.dataset.id); if (event.target.closest('[data-action]')) return; activeSlideId = id; renderSlides(); renderActiveSlide(); stopPlayback(true); if (settingEnabled('自动播放')) startPlayback(); });
        item.addEventListener('keydown', function (event) { if ((event.key === 'Enter' || event.key === ' ') && event.target === item) { event.preventDefault(); activeSlideId = Number(item.dataset.id); renderSlides(); renderActiveSlide(); stopPlayback(true); if (settingEnabled('自动播放')) startPlayback(); } });
        item.querySelector('[data-action="duplicate"]').addEventListener('click', function (event) { event.stopPropagation(); const original = slides.find(function (slide) { return slide.id === Number(item.dataset.id); }); const index = slides.indexOf(original); const copy = Object.assign({}, original, { id: Date.now(), title: original.title + '（副本）', components: original.components.slice() }); slides.splice(index+1,0,copy); activeSlideId = copy.id; renderSlides(); renderActiveSlide(); markDirty(); showToast('页面副本已添加'); });
        item.querySelector('[data-action="delete"]').addEventListener('click', function (event) { event.stopPropagation(); if (slides.length === 1) { showToast('课程至少需要保留一个页面'); return; } const slide = slides.find(function (entry) { return entry.id === Number(item.dataset.id); }); document.getElementById('confirmCopy').textContent = '确定要删除页面「' + slide.title + '」吗？'; confirmCallback = function () { const index = slides.indexOf(slide); slides.splice(index,1); if (activeSlideId === slide.id) activeSlideId = slides[Math.max(0,index-1)].id; closeModal('confirmModal'); renderSlides(); renderActiveSlide(); markDirty(); showToast('页面已删除'); }; openModal('confirmModal'); });
      });
    }
    function renderComponents() {
      const slide = getActiveSlide(); const container = document.getElementById('canvasComponents');
      container.innerHTML = slide.components.map(function (name) { return '<span class="canvas-component" data-component="' + escapeHtml(name) + '">' + escapeHtml(name) + '<button type="button" aria-label="移除' + escapeHtml(name) + '">×</button></span>'; }).join('');
      container.querySelectorAll('.canvas-component button').forEach(function (button) { button.addEventListener('click', function () { const component = button.parentElement.dataset.component; const index = slide.components.indexOf(component); if (index >= 0) slide.components.splice(index,1); renderComponents(); markDirty(); showToast('已移除' + component); }); });
    }
    function renderActiveSlide() {
      const slide = getActiveSlide(); if (!slide) return;
      const index = slides.indexOf(slide); document.getElementById('canvasKicker').textContent = '第 ' + (index+1) + ' 页 · ' + slide.type; document.getElementById('canvasTitle').textContent = slide.title; document.getElementById('canvasSubtitle').textContent = slide.subtitle; document.getElementById('titleInput').value = slide.title; document.getElementById('subtitleInput').value = slide.subtitle; lessonCanvas.dataset.theme = slide.theme; document.querySelectorAll('[data-theme]').forEach(function (button) { if (button.classList.contains('theme-button')) button.classList.toggle('is-active', button.dataset.theme === slide.theme); }); renderComponents();
    }
    function saveCourse() {
      const button = document.getElementById('saveButton'); button.disabled = true; button.textContent = '保存中…'; document.getElementById('saveStatus').textContent = '正在保存';
      setTimeout(function () { dirty = false; button.disabled = false; button.textContent = '已保存'; document.getElementById('saveStatus').textContent = '刚刚已保存'; showToast('课程内容已保存'); setTimeout(function () { button.textContent = '保存'; }, 1200); }, 500);
    }

    const params = new URLSearchParams(window.location.search); if (params.get('name')) document.getElementById('courseTitle').textContent = params.get('name');
    document.getElementById('addSlideButton').addEventListener('click', function () { const slide = { id: Date.now(), title: '新课程页面', type: '未命名页面', subtitle: '在右侧编辑这个页面的说明文字。', theme: 'white', components: [] }; slides.push(slide); activeSlideId = slide.id; renderSlides(); renderActiveSlide(); markDirty(); document.getElementById('titleInput').focus(); showToast('已添加新页面'); });
    document.getElementById('titleInput').addEventListener('input', function () { const slide = getActiveSlide(); slide.title = this.value || '未命名页面'; document.getElementById('canvasTitle').textContent = slide.title; renderSlides(); markDirty(); });
    document.getElementById('subtitleInput').addEventListener('input', function () { const slide = getActiveSlide(); slide.subtitle = this.value; document.getElementById('canvasSubtitle').textContent = slide.subtitle; markDirty(); });
    document.querySelectorAll('[data-component]').forEach(function (button) { if (!button.classList.contains('component-button')) return; button.addEventListener('click', function () { const slide = getActiveSlide(); const name = button.dataset.component; if (slide.components.includes(name)) { showToast(name + '已在当前页面中'); return; } slide.components.push(name); renderComponents(); markDirty(); showToast('已添加' + name); }); });
    document.querySelectorAll('.inspector-tab').forEach(function (tab) { tab.addEventListener('click', function () { document.querySelectorAll('.inspector-tab').forEach(function (item) { const active = item === tab; item.classList.toggle('is-active',active); item.setAttribute('aria-selected',String(active)); }); document.querySelectorAll('.inspector-pane').forEach(function (pane) { pane.classList.toggle('is-active', pane.id === 'pane-' + tab.dataset.pane); }); }); });
    document.querySelectorAll('.theme-button').forEach(function (button) { button.addEventListener('click', function () { document.querySelectorAll('.theme-button').forEach(function (item) { item.classList.toggle('is-active',item === button); }); getActiveSlide().theme = button.dataset.theme; lessonCanvas.dataset.theme = button.dataset.theme; markDirty(); }); });
    document.querySelectorAll('[data-align]').forEach(function (button) { button.addEventListener('click', function () { document.querySelectorAll('[data-align]').forEach(function (item) { item.classList.toggle('is-active',item === button); }); lessonCanvas.style.textAlign = button.dataset.align; lessonCanvas.style.alignItems = button.dataset.align === 'left' ? 'flex-start' : button.dataset.align === 'right' ? 'flex-end' : 'center'; document.getElementById('canvasKicker').style.alignSelf = button.dataset.align === 'left' ? 'flex-start' : button.dataset.align === 'right' ? 'flex-end' : 'center'; markDirty(); }); });
    document.getElementById('fontSizeRange').addEventListener('input', function () { document.getElementById('fontSizeValue').textContent = this.value; document.getElementById('canvasTitle').style.fontSize = this.value + 'px'; markDirty(); });
    document.querySelectorAll('[data-device]').forEach(function (button) { button.addEventListener('click', function () { document.querySelectorAll('[data-device]').forEach(function (item) { item.classList.toggle('is-active',item === button); }); lessonCanvas.dataset.device = button.dataset.device; showToast('已切换为' + button.textContent + '预览'); }); });
    document.querySelectorAll('[data-setting]').forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.dataset.setting === '显示字幕') document.getElementById('canvasSubtitle').style.display = input.checked ? '' : 'none';
        if (input.dataset.setting === '自动播放') input.checked ? startPlayback() : stopPlayback(false);
        markDirty(); showToast(input.dataset.setting + (input.checked ? '已开启' : '已关闭'));
      });
    });
    document.getElementById('durationInput').addEventListener('change', function () { let value = Math.max(5,Math.min(300,Number(this.value)||30)); this.value = value; stopPlayback(true); markDirty(); showToast('页面时长已更新为 ' + value + ' 秒'); });
    document.getElementById('playButton').addEventListener('click', togglePlayback);
    document.getElementById('restartButton').addEventListener('click', function () { stopPlayback(true); startPlayback(); showToast('已从头播放'); });
    document.getElementById('muteButton').addEventListener('click', function () { muted = !muted; this.textContent = muted ? '静' : '声'; this.setAttribute('aria-label', muted ? '取消静音' : '静音'); showToast(muted ? '声音已关闭' : '声音已开启'); });
    progressRange.addEventListener('input', function () { progress = Number(this.value); updateTime(); });
    document.getElementById('saveButton').addEventListener('click', saveCourse);
    document.getElementById('previewButton').addEventListener('click', function () { const slide = getActiveSlide(); document.getElementById('previewHeading').textContent = slide.title; document.getElementById('previewDescription').textContent = slide.subtitle; document.getElementById('previewStage').style.background = getComputedStyle(lessonCanvas).backgroundColor; document.getElementById('previewPlayButton').textContent = '▶ 开始播放'; openModal('previewModal'); });
    document.getElementById('previewPlayButton').addEventListener('click', function () { const active = this.textContent.indexOf('暂停') >= 0; this.textContent = active ? '▶ 继续播放' : 'Ⅱ 暂停播放'; showToast(active ? '预览已暂停' : '预览播放中'); });
    document.getElementById('publishButton').addEventListener('click', function () { if (dirty) { showToast('发布前正在保存更改'); saveCourse(); setTimeout(function () { openModal('publishModal'); }, 650); } else openModal('publishModal'); });
    document.getElementById('confirmPublishButton').addEventListener('click', function () { const scope = document.querySelector('input[name="publishScope"]:checked').value; const button = this; button.disabled = true; button.textContent = '发布中…'; setTimeout(function () { button.disabled = false; button.textContent = '确认发布'; document.getElementById('courseStatus').textContent = '已发布'; document.getElementById('courseStatus').classList.add('is-published'); document.getElementById('publishButton').textContent = '更新发布'; closeModal('publishModal'); showToast('课程已发布 · ' + scope); }, 650); });
    document.getElementById('confirmAction').addEventListener('click', function () { if (confirmCallback) { const callback = confirmCallback; confirmCallback = null; callback(); } });
    document.querySelectorAll('[data-close-modal]').forEach(function (button) { button.addEventListener('click', function () { closeModal(button.dataset.closeModal); }); });
    document.querySelectorAll('.modal').forEach(function (modal) { modal.addEventListener('click', function (event) { if (event.target === modal) closeModal(modal.id); }); });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape') document.querySelectorAll('.modal.is-open').forEach(function (modal) { closeModal(modal.id); }); if (event.code === 'Space' && !event.target.closest('input,textarea,button,select,[role="button"]')) { event.preventDefault(); togglePlayback(); } });
    renderSlides(); renderActiveSlide(); updateTime();
  })();
  </script>
</body>
</html>
