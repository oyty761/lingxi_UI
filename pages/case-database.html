<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个案数据库 - 灵小犀</title>
  <meta name="description" content="管理个案档案与干预小组">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* 页面专属紧凑样式 */

    /* 干预小组列表 */
    .group-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .group-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-base);
      padding: var(--space-sm) var(--space-base);
      background-color: var(--color-background);
      border-radius: var(--radius-md);
      transition: background-color var(--transition-fast);
    }

    .group-item:hover {
      background-color: var(--color-primary-light);
    }

    .group-item__info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .group-item__name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    .group-item__meta {
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    /* 快捷入口 */
    .quick-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .quick-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-base);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      border-radius: var(--radius-md);
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .quick-item:hover {
      color: var(--color-primary);
      background-color: var(--color-primary-light);
    }

    .quick-item__icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }

    /* 表格 */
    .case-table-wrapper {
      overflow: auto;
    }

    .case-table {
      min-width: 680px;
    }

    .case-table th:first-child,
    .case-table td:first-child {
      padding-left: var(--space-lg);
    }

    /* 姓名表头前增加与头像等宽的占位，使表头文字与姓名文字左对齐 */
    .case-table th:first-child::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-right: var(--space-sm);
      vertical-align: middle;
    }

.case-table th:last-child {
      text-align: right;
      padding-right: 110px;
    }

    .case-table td:last-child {
      padding-right: var(--space-lg);
      text-align: right;
    }

    .case-table td:last-child .table__actions {
      justify-content: flex-end;
    }

    .case-table tbody tr {
      transition: background-color var(--transition-fast);
    }

    .case-table tbody tr:hover {
      background-color: var(--color-primary-light);
    }

    .case-name {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .case-name__text {
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    /* 右侧辅助栏 */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      min-height: 0;
    }

    .right-panel .card {
      flex: 1;
      min-height: 0;
    }

    /* 表格操作按钮更紧凑 */
    .table__actions .btn--icon {
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 顶部导航栏 -->
    <nav class="topnav" role="navigation" aria-label="主导航">
      <div class="topnav__brand">
        <div class="topnav__logo">LOGO</div>
        <span class="topnav__name">灵小犀</span>
      </div>
      <div class="topnav__nav">
        <a class="topnav__link" href="#">
          <svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          工作台
        </a>
        <a class="topnav__link is-active" href="case-database.html" aria-current="page">
          <svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          个案数据库
        </a>
        <a class="topnav__link" href="#">
          <svg class="topnav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          课程中心
        </a>
      </div>
      <div class="topnav__user">
        <div class="avatar">U</div>
        <span>管理员</span>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main">
      <header class="main__header">
        <div>
          <h1 class="main__title">个案数据库</h1>
          <p class="main__subtitle">管理个案档案与干预小组</p>
        </div>
        <div class="main__actions">
          <button class="btn btn--primary-outline btn--sm" type="button" id="btn-create-group">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            新建小组
          </button>
          <button class="btn btn--primary btn--sm" type="button" id="btn-add-case">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            新增个案
          </button>
        </div>
      </header>

      <div class="main__body">
        <!-- 统计概览 -->
        <section class="stat-grid" aria-label="数据概览">
          <article class="stat-card stat-card--primary">
            <span class="stat-card__label">个案总数</span>
            <strong class="stat-card__value">2</strong>
            <span class="stat-card__trend">本月新增 0 人</span>
          </article>
          <article class="stat-card stat-card--secondary">
            <span class="stat-card__label">干预小组</span>
            <strong class="stat-card__value">1</strong>
            <span class="stat-card__trend">共 0 名成员</span>
          </article>
          <article class="stat-card stat-card--accent">
            <span class="stat-card__label">最近更新</span>
            <strong class="stat-card__value">2</strong>
            <span class="stat-card__trend">本周更新记录</span>
          </article>
        </section>

        <!-- 主体内容：左侧表格 + 右侧辅助信息 -->
        <div class="content-grid">
          <!-- 左侧：个案列表 -->
          <section class="card table-card" aria-labelledby="case-title">
            <div class="card__header">
              <h2 class="card__title" id="case-title">个案基本情况</h2>
              <span class="text-muted">共 2 条记录</span>
            </div>
            <div class="toolbar">
              <div class="toolbar__filters">
                <div class="toolbar__search">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input class="input" type="search" placeholder="搜索姓名">
                </div>
                <select class="toolbar__select" aria-label="性别筛选">
                  <option value="">全部性别</option>
                  <option value="male">男</option>
                  <option value="female">女</option>
                </select>
                <select class="toolbar__select" aria-label="上课形式筛选">
                  <option value="">全部形式</option>
                  <option value="one-on-one">1 对 1</option>
                  <option value="group">小组课</option>
                </select>
              </div>
            </div>
            <div class="card__body case-table-wrapper">
            <table class="table case-table">
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>性别</th>
                  <th>出生年月</th>
                  <th>年龄</th>
                  <th>上课形式</th>
                  <th>备注</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="case-name">
                      <div class="avatar" aria-hidden="true">2</div>
                      <span class="case-name__text">2b</span>
                    </div>
                  </td>
                  <td>男</td>
                  <td class="text-muted">—</td>
                  <td class="text-muted">—</td>
                  <td><span class="tag tag--primary">1 对 1</span></td>
                  <td class="text-muted">—</td>
                  <td>
                    <div class="table__actions">
                      <a class="table__action" href="case-detail.html">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
                          <path d="M22 12A10 10 0 0 0 12 2v10z"/>
                        </svg>
                        数据平台
                      </a>
                      <a class="table__action" href="#">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        上课
                      </a>
                      <button class="btn btn--icon btn-edit-case" type="button" aria-label="编辑" data-id="1">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                      </button>
                      <button class="btn btn--icon is-danger btn-delete" type="button" aria-label="删除" data-type="case" data-id="1" data-name="2b">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <polyline points="3 6 5 6 21 6"/>
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="case-name">
                      <div class="avatar" aria-hidden="true">3</div>
                      <span class="case-name__text">3 的</span>
                    </div>
                  </td>
                  <td>男</td>
                  <td class="text-muted">—</td>
                  <td class="text-muted">—</td>
                  <td><span class="tag tag--primary">1 对 1</span></td>
                  <td class="text-muted">—</td>
                  <td>
                    <div class="table__actions">
                      <a class="table__action" href="case-detail.html">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
                          <path d="M22 12A10 10 0 0 0 12 2v10z"/>
                        </svg>
                        数据平台
                      </a>
                      <a class="table__action" href="#">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        上课
                      </a>
                      <button class="btn btn--icon btn-edit-case" type="button" aria-label="编辑" data-id="2">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                      </button>
                      <button class="btn btn--icon is-danger btn-delete" type="button" aria-label="删除" data-type="case" data-id="2" data-name="3 的">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <polyline points="3 6 5 6 21 6"/>
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 右侧：辅助信息 -->
        <aside class="right-panel">
          <section class="card" aria-labelledby="group-title">
            <div class="card__header">
              <h2 class="card__title" id="group-title">干预小组</h2>
            </div>
            <div class="card__body">
              <div class="group-list">
                <article class="group-item" data-group-id="1">
                  <div class="group-item__info">
                    <span class="group-item__name">group1</span>
                    <span class="group-item__meta">0 名成员</span>
                  </div>
                  <div class="table__actions">
                    <button class="btn btn--icon" type="button" aria-label="编辑小组" id="btn-edit-group">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                      </svg>
                    </button>
                    <button class="btn btn--icon is-danger" type="button" aria-label="删除小组" id="btn-delete-group" data-id="1">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                      </svg>
                    </button>
                  </div>
                </article>
              </div>
            </div>
          </section>

          <section class="card" aria-labelledby="quick-title">
            <div class="card__header">
              <h2 class="card__title" id="quick-title">快捷入口</h2>
            </div>
            <div class="card__body">
              <nav class="quick-list" aria-label="快捷操作">
                <a class="quick-item" href="#" id="btn-import">
                  <span class="quick-item__icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="17 8 12 3 7 8"/>
                      <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                  </span>
                  批量导入个案
                </a>
                <a class="quick-item" href="#" id="btn-export">
                  <span class="quick-item__icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="7 10 12 15 17 10"/>
                      <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                  </span>
                  导出个案档案
                </a>
              </nav>
            </div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <!-- ======================
       弹窗：新建小组
       ====================== -->
  <div class="modal" id="modal-create-group" role="dialog" aria-modal="true" aria-labelledby="modal-create-group-title">
    <div class="modal__container">
      <div class="modal__header">
        <h3 class="modal__title" id="modal-create-group-title">新建小组</h3>
        <button class="modal__close" type="button" aria-label="关闭" data-close="modal-create-group">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="form-field">
          <label class="form-field__label" for="create-group-name">小组名称</label>
          <input class="input" type="text" id="create-group-name" placeholder="请输入小组名称">
        </div>
        <div class="form-field">
          <span class="form-field__label">选择个案</span>
          <div class="option-list__search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input class="input" type="search" id="create-group-search" placeholder="搜索个案姓名">
          </div>
          <div class="option-list" id="create-group-members"></div>
        </div>
        <div class="form-field">
          <label class="form-field__label" for="create-group-remark">小组备注</label>
          <textarea class="input" id="create-group-remark" placeholder="请输入小组备注"></textarea>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--secondary btn--sm" type="button" data-close="modal-create-group">取消</button>
        <button class="btn btn--primary btn--sm" type="button" id="create-group-submit">确认创建</button>
      </div>
    </div>
  </div>

  <!-- ======================
       弹窗：确认操作
       ====================== -->
  <div class="modal" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal__container" style="max-width: 400px;">
      <div class="modal__header">
        <h3 class="modal__title" id="modal-confirm-title">确认操作</h3>
        <button class="modal__close" type="button" aria-label="关闭" data-close="modal-confirm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <p id="confirm-message" style="color: var(--color-text-primary); font-size: var(--font-size-sm); line-height: var(--line-height-normal);"></p>
      </div>
      <div class="modal__footer">
        <button class="btn btn--secondary btn--sm" type="button" data-close="modal-confirm">取消</button>
        <button class="btn btn--danger btn--sm" type="button" id="confirm-submit">确认</button>
      </div>
    </div>
  </div>

  <!-- ======================
       弹窗：编辑小组
       ====================== -->
  <div class="modal" id="modal-edit-group" role="dialog" aria-modal="true" aria-labelledby="modal-edit-group-title">
    <div class="modal__container">
      <div class="modal__header">
        <h3 class="modal__title" id="modal-edit-group-title">编辑小组</h3>
        <button class="modal__close" type="button" aria-label="关闭" data-close="modal-edit-group">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <input type="hidden" id="edit-group-id">
        <div class="form-field">
          <label class="form-field__label" for="edit-group-name">小组名称</label>
          <input class="input" type="text" id="edit-group-name">
        </div>
        <div class="form-field">
          <span class="form-field__label">小组成员</span>
          <div class="option-list__search">

  <script>
  (function () {
    let cases = [
      { id: 1, name: '2b', gender: 'male', dob: '', platform: '', pretest: '', posttest: '', plan: '', mode: 'one-on-one', remark: '' },
      { id: 2, name: '3 的', gender: 'male', dob: '', platform: '', pretest: '', posttest: '', plan: '', mode: 'one-on-one', remark: '' }
    ];
    let groups = [
      { id: 1, name: 'group1', members: [], remark: '' }
    ];
    let nextCaseId = 3;
    let nextGroupId = 2;
    let confirmCallback = null;

    function $(selector) { return document.querySelector(selector); }
    function $$(selector) { return document.querySelectorAll(selector); }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function getAvatarText(name) {
      return name ? name.trim().slice(0, 1) : '?';
    }

    function formatGender(value) {
      return value === 'male' ? '男' : value === 'female' ? '女' : '—';
    }

    function formatMode(value) {
      return value === 'one-on-one' ? '1 对 1' : value === 'group' ? '小组课' : '—';
    }

    function calculateAge(dob) {
      if (!dob) return '—';
      const birth = new Date(dob + '-01');
      const now = new Date();
      let age = now.getFullYear() - birth.getFullYear();
      const m = now.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
      return age >= 0 ? age : '—';
    }

    function formatDob(dob) {
      if (!dob) return '—';
      const parts = dob.split('-');
      return parts[0] + ' 年 ' + parts[1] + ' 月';
    }

    function updateStats() {
      const total = cases.length;
      const groupCount = groups.length;
      const memberCount = groups.reduce(function (sum, g) { return sum + g.members.length; }, 0);

      const totalEl = $('.stat-card--primary .stat-card__value');
      if (totalEl) totalEl.textContent = total;

      const groupCountEl = $('.stat-card--secondary .stat-card__value');
      if (groupCountEl) groupCountEl.textContent = groupCount;

      const groupMetaEl = $('.stat-card--secondary .stat-card__trend');
      if (groupMetaEl) groupMetaEl.textContent = '共 ' + memberCount + ' 名成员';

      const recentEl = $('.stat-card--accent .stat-card__value');
      if (recentEl) recentEl.textContent = total;
    }

    function renderCases() {
      const tbody = $('.case-table tbody');
      if (!tbody) return;
      tbody.innerHTML = cases.map(function (c) {
        return '<tr>' +
          '<td><div class="case-name"><div class="avatar" aria-hidden="true">' + getAvatarText(c.name) + '</div><span class="case-name__text">' + escapeHtml(c.name) + '</span></div></td>' +
          '<td>' + formatGender(c.gender) + '</td>' +
          '<td class="text-muted">' + formatDob(c.dob) + '</td>' +
          '<td class="text-muted">' + calculateAge(c.dob) + '</td>' +
          '<td><span class="tag tag--primary">' + formatMode(c.mode) + '</span></td>' +
          '<td class="text-muted">' + (c.remark ? escapeHtml(c.remark) : '—') + '</td>' +
          '<td>' +
            '<div class="table__actions">' +
              '<a class="table__action" href="case-detail.html"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>数据平台</a>' +
              '<a class="table__action" href="#"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>上课</a>' +
              '<button class="btn btn--icon btn-edit-case" type="button" aria-label="编辑" data-id="' + c.id + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' +
              '<button class="btn btn--icon is-danger btn-delete" type="button" aria-label="删除" data-type="case" data-id="' + c.id + '" data-name="' + escapeHtml(c.name) + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');

      const countEl = $('#case-title + .text-muted');
      if (countEl) countEl.textContent = '共 ' + cases.length + ' 条记录';
      updateStats();
      bindActionButtons();
    }

    function renderGroups() {
      const list = $('.group-list');
      if (!list) return;
      list.innerHTML = groups.map(function (g) {
        return '<article class="group-item" data-group-id="' + g.id + '">' +
          '<div class="group-item__info"><span class="group-item__name">' + escapeHtml(g.name) + '</span><span class="group-item__meta">' + g.members.length + ' 名成员</span></div>' +
          '<div class="table__actions">' +
            '<button class="btn btn--icon btn-edit-group" type="button" aria-label="编辑小组" data-id="' + g.id + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' +
            '<button class="btn btn--icon is-danger btn-delete" type="button" aria-label="删除小组" data-type="group" data-id="' + g.id + '" data-name="' + escapeHtml(g.name) + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
          '</div>' +
        '</article>';
      }).join('');
      updateStats();
      bindGroupButtons();
      bindActionButtons();
    }

    function renderCaseOptions(containerId, selectedIds) {
      const container = $('#' + containerId);
      if (!container) return;
      if (cases.length === 0) {
        container.innerHTML = '<p class="form-field__hint">暂无可选个案</p>';
        return;
      }
      container.innerHTML = cases.map(function (c) {
        return '<label class="option-item"><input type="checkbox" value="' + c.id + '"' + (selectedIds.indexOf(c.id) !== -1 ? ' checked' : '') + '><span>' + escapeHtml(c.name) + '</span></label>';
      }).join('');
    }

    function filterCaseOptions(containerId, query) {
      const container = $('#' + containerId);
      if (!container) return;
      const items = container.querySelectorAll('.option-item');
      const q = query.toLowerCase().trim();
      items.forEach(function (item) {
        const text = item.textContent.trim().toLowerCase();
        item.style.display = text.indexOf(q) !== -1 ? 'flex' : 'none';
      });
    }

    function openModal(id) {
      const modal = $('#' + id);
      if (!modal) return;
      modal.classList.add('is-open');
      requestAnimationFrame(function () { modal.classList.add('is-visible'); });
      document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
      const modal = $('#' + id);
      if (!modal) return;
      modal.classList.remove('is-visible');
      setTimeout(function () {
        modal.classList.remove('is-open');
        document.body.style.overflow = '';
      }, 200);
    }

    function setupConfirm(title, message, onConfirm) {
      $('#modal-confirm-title').textContent = title;
      $('#confirm-message').textContent = message;
      confirmCallback = onConfirm;
      openModal('modal-confirm');
    }

    function getFormCaseValues(prefix) {
      return {
        name: $('#' + prefix + '-name').value.trim(),
        gender: $('#' + prefix + '-gender').value,
        dob: $('#' + prefix + '-dob').value,
        platform: $('#' + prefix + '-platform').value.trim(),
        pretest: $('#' + prefix + '-pretest').value.trim(),
        posttest: $('#' + prefix + '-posttest').value.trim(),
        plan: $('#' + prefix + '-plan').value.trim(),
        mode: $('#' + prefix + '-mode').value,
        remark: $('#' + prefix + '-remark').value.trim()
      };
    }

    function setFormCaseValues(prefix, c) {
      $('#' + prefix + '-id').value = c.id;
      $('#' + prefix + '-name').value = c.name;
      $('#' + prefix + '-gender').value = c.gender || 'male';
      $('#' + prefix + '-dob').value = c.dob || '';
      $('#' + prefix + '-platform').value = c.platform || '';
      $('#' + prefix + '-pretest').value = c.pretest || '';
      $('#' + prefix + '-posttest').value = c.posttest || '';
      $('#' + prefix + '-plan').value = c.plan || '';
      $('#' + prefix + '-mode').value = c.mode || 'one-on-one';
      $('#' + prefix + '-remark').value = c.remark || '';
    }

    function clearFormCaseValues(prefix) {
      $('#' + prefix + '-name').value = '';
      $('#' + prefix + '-gender').value = 'male';
      $('#' + prefix + '-dob').value = '';
      $('#' + prefix + '-platform').value = '';
      $('#' + prefix + '-pretest').value = '';
      $('#' + prefix + '-posttest').value = '';
      $('#' + prefix + '-plan').value = '';
      $('#' + prefix + '-mode').value = 'one-on-one';
      $('#' + prefix + '-remark').value = '';
    }

    function getSelectedMemberIds(containerId) {
      return Array.prototype.map.call($$('#' + containerId + ' input[type="checkbox"]:checked'), function (cb) {
        return parseInt(cb.value, 10);
      });
    }

    function bindActionButtons() {
      $$('.btn-edit-case').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = parseInt(btn.dataset.id, 10);
          const c = cases.find(function (x) { return x.id === id; });
          if (!c) return;
          setFormCaseValues('edit-case', c);
          openModal('modal-edit-case');
        });
      });

      $$('.btn-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const type = btn.dataset.type;
          const id = parseInt(btn.dataset.id, 10);
          const name = btn.dataset.name;
          if (type === 'case') {
            setupConfirm('删除个案', '确定要删除个案「' + name + '」吗？删除后不可恢复。', function () {
              cases = cases.filter(function (x) { return x.id !== id; });
              groups.forEach(function (g) { g.members = g.members.filter(function (mid) { return mid !== id; }); });
              renderCases();
              renderGroups();
              closeModal('modal-confirm');
            });
          } else if (type === 'group') {
            setupConfirm('删除小组', '确定要删除小组「' + name + '」吗？删除后不可恢复。', function () {
              groups = groups.filter(function (g) { return g.id !== id; });
              renderGroups();
              closeModal('modal-confirm');
            });
          }
        });
      });
    }

    function bindGroupButtons() {
      $$('.btn-edit-group').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = parseInt(btn.dataset.id, 10);
          const g = groups.find(function (x) { return x.id === id; });
          if (!g) return;
          $('#edit-group-id').value = g.id;
          $('#edit-group-name').value = g.name;
          $('#edit-group-remark').value = g.remark;
          $('#edit-group-search').value = '';
          renderCaseOptions('edit-group-members', g.members);
          openModal('modal-edit-group');
        });
      });
    }

    function init() {
      bindActionButtons();
      renderGroups();

      $$('[data-close]').forEach(function (btn) {
        btn.addEventListener('click', function () { closeModal(btn.dataset.close); });
      });

      $$('.modal').forEach(function (modal) {
        modal.addEventListener('click', function (e) {
          if (e.target === modal) closeModal(modal.id);
        });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          $$('.modal.is-visible').forEach(function (modal) { closeModal(modal.id); });
        }
      });

      $('#btn-create-group').addEventListener('click', function () {
        $('#create-group-name').value = '';
        $('#create-group-remark').value = '';
        $('#create-group-search').value = '';
        renderCaseOptions('create-group-members', []);
        openModal('modal-create-group');
      });

      $('#create-group-search').addEventListener('input', function () {
        filterCaseOptions('create-group-members', this.value);
      });

      $('#create-group-submit').addEventListener('click', function () {
        const name = $('#create-group-name').value.trim();
        if (!name) { alert('请输入小组名称'); return; }
        groups.push({
          id: nextGroupId++,
          name: name,
          members: getSelectedMemberIds('create-group-members'),
          remark: $('#create-group-remark').value.trim()
        });
        renderGroups();
        closeModal('modal-create-group');
      });

      $('#edit-group-search').addEventListener('input', function () {
        filterCaseOptions('edit-group-members', this.value);
      });

      $('#edit-group-submit').addEventListener('click', function () {
        const id = parseInt($('#edit-group-id').value, 10);
        const g = groups.find(function (x) { return x.id === id; });
        if (!g) return;
        const name = $('#edit-group-name').value.trim();
        if (!name) { alert('请输入小组名称'); return; }
        g.name = name;
        g.members = getSelectedMemberIds('edit-group-members');
        g.remark = $('#edit-group-remark').value.trim();
        renderGroups();
        closeModal('modal-edit-group');
      });

      $('#btn-add-case').addEventListener('click', function () {
        clearFormCaseValues('add-case');
        openModal('modal-add-case');
      });

      $('#add-case-submit').addEventListener('click', function () {
        const values = getFormCaseValues('add-case');
        if (!values.name) { alert('请输入姓名'); return; }
        cases.push(Object.assign({ id: nextCaseId++ }, values));
        renderCases();
        closeModal('modal-add-case');
      });

      $('#edit-case-submit').addEventListener('click', function () {
        const id = parseInt($('#edit-case-id').value, 10);
        const c = cases.find(function (x) { return x.id === id; });
        if (!c) return;
        const values = getFormCaseValues('edit-case');
        if (!values.name) { alert('请输入姓名'); return; }
        Object.assign(c, values);
        renderCases();
        closeModal('modal-edit-case');
      });

      $('#btn-import').addEventListener('click', function (e) {
        e.preventDefault();
        $('#import-file').value = '';
        $('#import-file-name').textContent = '';
        openModal('modal-import');
      });

      $('#import-file').addEventListener('change', function () {
        const file = $('#import-file').files[0];
        $('#import-file-name').textContent = file ? '已选择：' + file.name : '';
      });

      $('#import-submit').addEventListener('click', function () {
        const file = $('#import-file').files[0];
        if (!file) { alert('请选择要导入的文件'); return; }
        cases.push({
          id: nextCaseId++,
          name: '导入个案 ' + nextCaseId,
          gender: 'male',
          dob: '',
          platform: '',
          pretest: '',
          posttest: '',
          plan: '',
          mode: 'one-on-one',
          remark: '来自 ' + file.name
        });
        renderCases();
        closeModal('modal-import');
        alert('导入成功');
      });

      $('#btn-export').addEventListener('click', function (e) {
        e.preventDefault();
        openModal('modal-export');
      });

      $('#export-submit').addEventListener('click', function () {
        const format = document.querySelector('input[name="export-format"]:checked').value;
        closeModal('modal-export');
        alert('已导出为 ' + format.toUpperCase() + ' 格式');
      });

      $('#confirm-submit').addEventListener('click', function () {
        if (confirmCallback) {
          confirmCallback();
          confirmCallback = null;
        }
      });
    }

    init();
  })();
  </script>
</body>
</html>
