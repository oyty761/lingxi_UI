<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 灵小犀</title>
  <meta name="description" content="学习困难儿童辅助平台登录">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    /* 基础重置 */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      line-height: var(--line-height-normal);
      color: var(--color-text-primary);
      background-color: var(--color-background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
    }

    .login-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    a {
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    a:hover,
    a:focus {
      color: var(--color-primary);
    }

    /* 登录卡片 */
    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--color-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-3xl) var(--space-2xl);
      position: relative;
      overflow: hidden;
    }

    /* 顶部装饰条：小面积蓝色 */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background-color: var(--color-primary);
    }

    /* 登录头部 */
    .login-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--space-lg);
      background-color: var(--color-primary-light);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
      color: var(--color-primary);
    }

    /* Logo 占位区域，客户可将此处替换为真实 logo 图片 */
    .login-logo.is-placeholder {
      color: var(--color-primary);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.05em;
    }

    .login-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-tight);
      color: var(--color-text-primary);
      margin-bottom: var(--space-sm);
    }

    .login-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    /* 表单 */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .form-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 var(--space-base);
      font-family: inherit;
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .form-input::placeholder {
      color: var(--color-text-tertiary);
    }

    .form-input:hover {
      border-color: var(--color-text-tertiary);
    }

    .form-input:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px var(--color-primary-light);
    }

    .form-input.is-invalid {
      border-color: var(--color-error);
      background-color: var(--color-error-light);
    }

    .form-error {
      display: none;
      font-size: var(--font-size-xs);
      color: var(--color-error);
    }

    .form-input.is-invalid + .form-error {
      display: block;
    }

    /* 表单选项 */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--font-size-sm);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--color-primary);
      font-weight: var(--font-weight-medium);
    }

    .forgot-link:hover,
    .forgot-link:focus {
      color: var(--color-primary-hover);
    }

    /* 弹窗 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      background-color: rgba(44, 62, 80, 0.45);
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .modal.is-open {
      display: flex;
    }

    .modal.is-visible {
      opacity: 1;
    }

    .modal__container {
      width: 100%;
      max-width: 420px;
      max-height: calc(100vh - var(--space-2xl));
      display: flex;
      flex-direction: column;
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
      overflow: hidden;
      transform: translateY(8px);
      transition: transform var(--transition-base);
    }

    .modal.is-visible .modal__container {
      transform: translateY(0);
    }

    .modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-base);
      padding: var(--space-base) var(--space-lg);
      border-bottom: 1px solid var(--color-divider);
    }

    .modal__title {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    .modal__close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      background-color: transparent;
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-xl);
      line-height: 1;
      cursor: pointer;
      transition: color var(--transition-fast), background-color var(--transition-fast);
    }

    .modal__close:hover {
      color: var(--color-text-primary);
      background-color: var(--color-background);
    }

    .modal__body {
      padding: var(--space-lg);
      overflow-y: auto;
    }

    .modal__footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-base);
      padding: var(--space-base) var(--space-lg);
      border-top: 1px solid var(--color-divider);
    }

    .modal__btn {
      height: 40px;
      padding: 0 var(--space-lg);
      font-family: inherit;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color var(--transition-fast), transform var(--transition-fast);
    }

    .modal__btn:active {
      transform: scale(0.98);
    }

    .modal__btn--primary {
      color: var(--color-text-on-primary);
      background-color: var(--color-primary);
    }

    .modal__btn--primary:hover {
      background-color: var(--color-primary-hover);
    }

    .modal__btn--secondary {
      color: var(--color-text-secondary);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
    }

    .modal__btn--secondary:hover {
      background-color: var(--color-background);
    }

    /* 登录按钮 */
    .login-button {
      width: 100%;
      height: 48px;
      margin-top: var(--space-sm);
      font-family: inherit;
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-on-primary);
      background-color: var(--color-primary);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color var(--transition-fast), transform var(--transition-fast);
    }

    .login-button:hover {
      background-color: var(--color-primary-hover);
    }

    .login-button:active {
      transform: scale(0.98);
    }

    /* 注册提示 */
    .register-hint {
      text-align: center;
      margin-top: var(--space-xl);
      padding-top: var(--space-xl);
      border-top: 1px solid var(--color-divider);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .register-hint a {
      color: var(--color-primary);
      font-weight: var(--font-weight-medium);
      margin-left: var(--space-xs);
    }

    /* 底部装饰 */
    .login-footer {
      margin-top: var(--space-2xl);
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    /* 响应式微调 */
    @media (max-width: 480px) {
      .login-card {
        padding: var(--space-2xl) var(--space-lg);
        border-radius: var(--radius-lg);
      }

      .login-title {
        font-size: var(--font-size-xl);
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <main class="login-card" role="main">
      <div class="login-header">
      <!-- 客户可将下方占位区域替换为真实 logo 图片，例如：<img src="../assets/images/logo.png" alt="灵小犀 Logo"> -->
      <div class="login-logo is-placeholder" aria-label="灵小犀 Logo 占位">
        LOGO
      </div>
      <h1 class="login-title">欢迎回到灵小犀</h1>
      <p class="login-subtitle">用心陪伴，帮助每一位孩子快乐成长</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="phone">手机号码</label>
        <input
          class="form-input"
          id="phone"
          name="phone"
          type="tel"
          placeholder="请输入手机号码"
          autocomplete="tel"
          maxlength="11"
          required
        >
        <span class="form-error" id="phoneError">请输入正确的 11 位手机号码</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">登录密码</label>
        <input
          class="form-input"
          id="password"
          name="password"
          type="password"
          placeholder="请输入登录密码"
          autocomplete="current-password"
          minlength="6"
          required
        >
        <span class="form-error" id="passwordError">密码长度不能少于 6 位</span>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" id="remember">
          <span>记住我</span>
        </label>
        <a class="forgot-link" href="#" id="forgotLink">找回密码？</a>
      </div>

      <button class="login-button" type="submit">登 录</button>
    </form>

    <p class="register-hint">
      还没有账号？<a href="#" id="registerLink">立即注册</a>
    </p>

    <footer class="login-footer">
      登录即代表您同意《用户协议》与《隐私政策》
    </footer>
  </main>
  </div>

  <!-- 找回密码弹窗 -->
  <div class="modal" id="forgotModal" role="dialog" aria-modal="true" aria-labelledby="forgotTitle">
    <div class="modal__container">
      <form id="forgotForm">
        <div class="modal__header">
          <h2 class="modal__title" id="forgotTitle">找回密码</h2>
          <button class="modal__close" type="button" aria-label="关闭" data-close-modal>&times;</button>
        </div>
        <div class="modal__body">
          <p class="login-subtitle" style="margin-bottom: var(--space-lg);">请输入手机号，我们将向该手机号发送验证码以重置密码。</p>
          <div class="form-group">
            <label class="form-label" for="forgotPhone">手机号码</label>
            <input class="form-input" id="forgotPhone" name="phone" type="tel" placeholder="请输入手机号码" maxlength="11" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="forgotCode">验证码</label>
            <input class="form-input" id="forgotCode" name="code" type="text" placeholder="请输入验证码" maxlength="6" required>
          </div>
        </div>
        <div class="modal__footer">
          <button class="modal__btn modal__btn--secondary" type="button" data-close-modal>取消</button>
          <button class="modal__btn modal__btn--primary" type="submit">提交</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 注册弹窗 -->
  <div class="modal" id="registerModal" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
    <div class="modal__container">
      <form id="registerForm">
        <div class="modal__header">
          <h2 class="modal__title" id="registerTitle">注册账号</h2>
          <button class="modal__close" type="button" aria-label="关闭" data-close-modal>&times;</button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label" for="registerPhone">手机号码</label>
            <input class="form-input" id="registerPhone" name="phone" type="tel" placeholder="请输入手机号码" maxlength="11" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="registerPassword">设置密码</label>
            <input class="form-input" id="registerPassword" name="password" type="password" placeholder="请设置登录密码" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="registerConfirmPassword">确认密码</label>
            <input class="form-input" id="registerConfirmPassword" name="confirmPassword" type="password" placeholder="请再次输入密码" minlength="6" required>
          </div>
        </div>
        <div class="modal__footer">
          <button class="modal__btn modal__btn--secondary" type="button" data-close-modal>取消</button>
          <button class="modal__btn modal__btn--primary" type="submit">注册</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const phoneInput = document.getElementById('phone');
      const passwordInput = document.getElementById('password');

      function validatePhone(value) {
        return /^1[3-9]\d{9}$/.test(value);
      }

      function setInvalid(input, isInvalid) {
        input.classList.toggle('is-invalid', isInvalid);
      }

      phoneInput.addEventListener('input', function () {
        setInvalid(phoneInput, false);
      });

      passwordInput.addEventListener('input', function () {
        setInvalid(passwordInput, false);
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const phone = phoneInput.value.trim();
        const password = passwordInput.value.trim();
        let hasError = false;

        if (!validatePhone(phone)) {
          setInvalid(phoneInput, true);
          hasError = true;
        }

        if (password.length < 6) {
          setInvalid(passwordInput, true);
          hasError = true;
        }

        if (!hasError) {
          // 演示项目：仅在前端提示登录成功
          alert('登录信息校验通过（演示项目，未连接后端）');
        }
      });

      // 弹窗控制
      const forgotLink = document.getElementById('forgotLink');
      const registerLink = document.getElementById('registerLink');
      const forgotModal = document.getElementById('forgotModal');
      const registerModal = document.getElementById('registerModal');

      function openModal(modal) {
        modal.classList.add('is-open');
        // 强制重排以触发过渡动画
        void modal.offsetWidth;
        modal.classList.add('is-visible');
        const firstInput = modal.querySelector('input');
        if (firstInput) firstInput.focus();
      }

      function closeModal(modal) {
        modal.classList.remove('is-visible');
        setTimeout(function () {
          modal.classList.remove('is-open');
        }, 200);
      }

      function bindModal(link, modal) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          openModal(modal);
        });

        modal.addEventListener('click', function (event) {
          if (event.target === modal) {
            closeModal(modal);
          }
        });

        modal.querySelectorAll('[data-close-modal]').forEach(function (button) {
          button.addEventListener('click', function () {
            closeModal(modal);
          });
        });
      }

      bindModal(forgotLink, forgotModal);
      bindModal(registerLink, registerModal);

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          [forgotModal, registerModal].forEach(function (modal) {
            if (modal.classList.contains('is-open')) {
              closeModal(modal);
            }
          });
        }
      });

      // 找回密码表单
      document.getElementById('forgotForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const phone = document.getElementById('forgotPhone').value.trim();
        if (!validatePhone(phone)) {
          alert('请输入正确的 11 位手机号码');
          return;
        }
        alert('验证码已发送（演示项目，未连接后端）');
        closeModal(forgotModal);
      });

      // 注册表单
      document.getElementById('registerForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const phone = document.getElementById('registerPhone').value.trim();
        const password = document.getElementById('registerPassword').value.trim();
        const confirmPassword = document.getElementById('registerConfirmPassword').value.trim();

        if (!validatePhone(phone)) {
          alert('请输入正确的 11 位手机号码');
          return;
        }

        if (password.length < 6) {
          alert('密码长度不能少于 6 位');
          return;
        }

        if (password !== confirmPassword) {
          alert('两次输入的密码不一致');
          return;
        }

        alert('注册信息校验通过（演示项目，未连接后端）');
        closeModal(registerModal);
      });
    })();
  </script>
</body>
</html>
