<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>张柏霖 - 个案详情 - 灵小犀</title>
  <meta name="description" content="具体个案的康复数据、能力评估与课次历史">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* 页面专属样式 */

    /* 顶部返回与标题 */
    .case-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-base);
      padding: var(--space-base) var(--space-xl);
      background-color: var(--color-surface);
      border-bottom: 2px solid var(--color-border);
      position: relative;
    }

    .case-header::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 120px;
      height: 4px;
      background-color: var(--color-primary);
      border-right: 2px solid var(--color-border);
    }

    .case-header__main {
      display: flex;
      align-items: center;
      gap: var(--space-base);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      color: var(--color-text-primary);
      background-color: var(--color-surface);
      border: 2px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .back-link:hover {
      background-color: var(--color-primary-light);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
    }

    .back-link:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .case-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .case-title__name {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      line-height: 1.2;
    }

    .case-title__meta {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    /* 标签页 */
    .tabs {
      display: flex;
      gap: var(--space-base);
      padding: var(--space-base) var(--space-xl);
      background-color: var(--color-surface);
      border-bottom: 2px solid var(--color-border);
      flex-shrink: 0;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      padding: var(--space-sm) var(--space-base);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      background-color: var(--color-surface);
      border: 2px solid transparent;
      cursor: pointer;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .tab:hover {
      background-color: var(--color-background);
      border-color: var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .tab.is-active {
      color: var(--color-text-primary);
      background-color: var(--color-primary-light);
      border-color: var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    /* 统计看板 */
    .stat-grid--4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .stat-card--plain {
      background-color: var(--color-surface);
    }

    .stat-card--plain .stat-card__value {
      color: var(--color-text-primary);
    }

    /* 能力评估 */
    .skill-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .skill-item {
      display: grid;
      grid-template-columns: 28px 1fr 40px;
      align-items: center;
      gap: var(--space-base);
    }

    .skill-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-on-primary);
      background-color: var(--color-primary);
      border: 2px solid var(--color-border);
      flex-shrink: 0;
    }

    .skill-icon--secondary {
      background-color: var(--color-secondary);
    }

    .skill-icon--accent {
      background-color: var(--color-accent);
      color: var(--color-text-primary);
    }

    .skill-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .skill-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
    }

    .skill-bar {
      height: 8px;
      background-color: var(--color-background);
      border: 2px solid var(--color-border);
      overflow: hidden;
    }

    .skill-bar__fill {
      height: 100%;
      background-color: var(--color-primary);
      transition: width var(--transition-base);
    }

    .skill-value {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-secondary);
      text-align: right;
    }

    .skill-empty {
      margin-top: var(--space-base);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
    }

    /* 空状态 */
    .empty-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-base);
      padding: var(--space-2xl);
      color: var(--color-text-tertiary);
      text-align: center;
      border: 2px dashed var(--color-border);
      background-color: var(--color-background);
      height: 100%;
      min-height: 120px;
    }

    .empty-box__icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface);
      border: 2px solid var(--color-border);
    }

    /* 表格 */
    .history-table-wrapper {
      overflow: auto;
    }

    .history-table {
      min-width: 560px;
    }

    .history-table tbody td {
      color: var(--color-text-secondary);
    }

    .history-table .empty-cell {
      text-align: center;
      color: var(--color-text-tertiary);
      padding: var(--space-xl);
    }

    /* 治疗师信息 */
    .therapist-bar {
      display: flex;
      align-items: center;
      gap: var(--space-base);
      padding: var(--space-base);
      background-color: var(--color-surface);
      border-top: 2px solid var(--color-border);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .therapist-bar strong {
      color: var(--color-text-primary);
    }

    /* 布局调整 */
    .main__body {
      padding-bottom: 0;
    }

    .history-card {
      flex: 0 0 auto;
    }

    /* 响应式 */
    @media (max-width: 1024px) {
      .stat-grid--4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .case-header {
        padding: var(--space-base) var(--space-lg);
      }

      .tabs {
        padding: var(--space-base) var(--space-lg);
      }

      .stat-grid--4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" role="navigation" aria-label="主导航">
      <div class="sidebar__brand">
        <div class="sidebar__logo">LOGO</div>
        <span class="sidebar__name">灵小犀</span>
      </div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="#">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          工作台
        </a>
        <a class="sidebar__link is-active" href="case-database.html" aria-current="page">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          个案数据库
        </a>
        <a class="sidebar__link" href="#">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          课程中心
        </a>
      </nav>
      <div class="sidebar__footer">
        <div style="display: flex; align-items: center; gap: var(--space-sm);">
          <div style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background-color: var(--color-primary); color: var(--color-text-on-primary); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); border: 2px solid var(--color-border);">U</div>
          <span style="font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">管理员</span>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 顶部标题栏 -->
      <header class="case-header">
        <div class="case-header__main">
          <a class="back-link" href="case-database.html" aria-label="返回个案数据库">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
          </a>
          <div class="case-title">
            <h1 class="case-title__name">张柏霖</h1>
            <p class="case-title__meta">男 · 2018 年 3 月出生 · 8 岁 · 1 对 1 上课</p>
          </div>
        </div>
        <button class="btn btn--primary btn--sm" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          开始上课
        </button>
      </header>

      <!-- 标签页 -->
      <nav class="tabs" aria-label="个案数据标签">
        <button class="tab is-active" type="button" aria-current="page">康复数据平台</button>
        <button class="tab" type="button">录音与语音样本</button>
      </nav>

      <div class="main__body">
        <!-- 统计看板 -->
        <section class="stat-grid stat-grid--4" aria-label="康复数据概览">
          <article class="stat-card stat-card--plain">
            <span class="stat-card__label">累计课时</span>
            <strong class="stat-card__value">0</strong>
            <span class="stat-card__trend">共 0 分钟</span>
          </article>
          <article class="stat-card stat-card--plain">
            <span class="stat-card__label">累计回合</span>
            <strong class="stat-card__value">0</strong>
            <span class="stat-card__trend">已参与训练</span>
          </article>
          <article class="stat-card stat-card--primary">
            <span class="stat-card__label">独立正确率</span>
            <strong class="stat-card__value">0%</strong>
            <span class="stat-card__trend">无辅助完成</span>
          </article>
          <article class="stat-card stat-card--secondary">
            <span class="stat-card__label">含提示正确率</span>
            <strong class="stat-card__value">0%</strong>
            <span class="stat-card__trend">含辅助完成</span>
          </article>
        </section>

        <!-- 两栏内容 -->
        <div class="content-grid">
          <!-- 左侧：故事语法要素掌握 -->
          <section class="card" aria-labelledby="skill-title">
            <div class="card__header">
              <h2 class="card__title" id="skill-title">故事语法要素掌握（独立正确率）</h2>
            </div>
            <div class="card__body">
              <div class="skill-list">
                <div class="skill-item">
                  <div class="skill-icon">人</div>
                  <div class="skill-info">
                    <span class="skill-name">人物</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon skill-icon--secondary">场</div>
                  <div class="skill-info">
                    <span class="skill-name">场景</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon">问</div>
                  <div class="skill-info">
                    <span class="skill-name">问题</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon skill-icon--accent">感</div>
                  <div class="skill-info">
                    <span class="skill-name">感受</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon">计</div>
                  <div class="skill-info">
                    <span class="skill-name">计划</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon skill-icon--secondary">行</div>
                  <div class="skill-info">
                    <span class="skill-name">行动</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon">结</div>
                  <div class="skill-info">
                    <span class="skill-name">结果</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon">局</div>
                  <div class="skill-info">
                    <span class="skill-name">结局</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
                <div class="skill-item">
                  <div class="skill-icon skill-icon--accent">受</div>
                  <div class="skill-info">
                    <span class="skill-name">结局感受</span>
                    <div class="skill-bar">
                      <div class="skill-bar__fill" style="width: 0%"></div>
                    </div>
                  </div>
                  <span class="skill-value">0%</span>
                </div>
              </div>
              <p class="skill-empty">暂无数据，上课记录后会自动生成。</p>
            </div>
          </section>

          <!-- 右侧：分课程掌握情况 -->
          <section class="card" aria-labelledby="course-title">
            <div class="card__header">
              <h2 class="card__title" id="course-title">分课程掌握情况</h2>
            </div>
            <div class="card__body">
              <div class="empty-box">
                <div class="empty-box__icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </div>
                <span>暂无数据</span>
              </div>
            </div>
          </section>
        </div>

        <!-- 课次历史 -->
        <section class="card history-card" aria-labelledby="history-title">
          <div class="card__header">
            <h2 class="card__title" id="history-title">课次历史</h2>
          </div>
          <div class="card__body history-table-wrapper">
            <table class="table history-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>课程</th>
                  <th>形式</th>
                  <th>回合数</th>
                  <th>独立正确率</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="5" class="empty-cell">还没有上课记录</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- 底部治疗师信息 -->
      <div class="therapist-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>负责治疗师：<strong>王老师</strong></span>
      </div>
    </main>
  </div>
</body>
</html>
