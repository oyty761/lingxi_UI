<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个案数据库 - 灵小犀</title>
  <meta name="description" content="管理个案档案与干预小组">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* 页面专属样式 */

    .avatar {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-primary);
      color: var(--color-text-on-primary);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      border: 2px solid var(--color-border);
      flex-shrink: 0;
    }

    /* 干预小组 */
    .group-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .group-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-base);
      padding: var(--space-sm) var(--space-base);
      background-color: var(--color-background);
      border: 2px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .group-item:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
    }

    .group-item__info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .group-item__name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
    }

    .group-item__meta {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    /* 快捷入口 */
    .quick-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .quick-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-base);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      border: 2px solid var(--color-border);
      background-color: var(--color-surface);
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .quick-item:hover {
      background-color: var(--color-primary-light);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
    }

    .quick-item:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .quick-item__icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-background);
      border: 2px solid var(--color-border);
      flex-shrink: 0;
    }

    /* 表格 */
    .case-table-wrapper {
      overflow: auto;
    }

    .case-table {
      min-width: 680px;
    }

    .case-table th:first-child,
    .case-table td:first-child {
      padding-left: var(--space-lg);
    }

    .case-table th:last-child,
    .case-table td:last-child {
      padding-right: var(--space-lg);
    }

    .case-table tbody tr {
      transition: background-color var(--transition-fast);
    }

    .case-table tbody tr:hover {
      background-color: var(--color-primary-light);
    }

    .case-name {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .case-name__text {
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
    }

    .text-muted {
      color: var(--color-text-tertiary);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px var(--space-sm);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      border: 2px solid var(--color-border);
      background-color: var(--color-surface);
      white-space: nowrap;
    }

    .tag--primary {
      background-color: var(--color-primary-light);
      color: var(--color-primary-hover);
    }

    /* 全宽表格卡片 */
    .table-card .card__body {
      padding: 0;
    }

    /* 顶部标题区装饰 */
    .main__header {
      position: relative;
    }

    .main__header::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 120px;
      height: 4px;
      background-color: var(--color-primary);
      border-right: 2px solid var(--color-border);
    }

    /* 不对称标题 */
    .page-tag {
      display: inline-block;
      padding: 2px var(--space-sm);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      background-color: var(--color-accent-light);
      border: 2px solid var(--color-border);
      margin-bottom: var(--space-xs);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" role="navigation" aria-label="主导航">
      <div class="sidebar__brand">
        <div class="sidebar__logo">LOGO</div>
        <span class="sidebar__name">灵小犀</span>
      </div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="#">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          工作台
        </a>
        <a class="sidebar__link is-active" href="case-database.html" aria-current="page">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          个案数据库
        </a>
        <a class="sidebar__link" href="#">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          课程中心
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="case-name">
          <div class="avatar">U</div>
          <span class="case-name__text">管理员</span>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <header class="main__header">
        <div>
          <span class="page-tag">数据管理</span>
          <h1 class="main__title">个案数据库</h1>
          <p class="main__subtitle">管理学习困难儿童的个案档案与干预小组</p>
        </div>
        <button class="btn btn--primary btn--sm" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新增个案
        </button>
      </header>

      <div class="main__body">
        <!-- 统计概览 -->
        <section class="stat-grid" aria-label="数据概览">
          <article class="stat-card stat-card--primary">
            <span class="stat-card__label">个案总数</span>
            <strong class="stat-card__value">2</strong>
            <span class="stat-card__trend">本月新增 0 人</span>
          </article>
          <article class="stat-card stat-card--secondary">
            <span class="stat-card__label">干预小组</span>
            <strong class="stat-card__value">1</strong>
            <span class="stat-card__trend">共 0 名成员</span>
          </article>
          <article class="stat-card stat-card--accent">
            <span class="stat-card__label">最近更新</span>
            <strong class="stat-card__value">2</strong>
            <span class="stat-card__trend">本周更新记录</span>
          </article>
        </section>

        <!-- 两栏内容 -->
        <div class="content-grid">
          <!-- 左侧：干预小组 -->
          <section class="card" aria-labelledby="group-title">
            <div class="card__header">
              <h2 class="card__title" id="group-title">干预小组</h2>
              <button class="btn btn--primary btn--sm" type="button">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                新建小组
              </button>
            </div>
            <div class="card__body">
              <div class="group-list">
                <article class="group-item">
                  <div class="group-item__info">
                    <span class="group-item__name">低年级干预一组</span>
                    <span class="group-item__meta">0 名成员 · 创建于 2026-08-10</span>
                  </div>
                  <div class="table__actions">
                    <button class="btn btn--icon" type="button" aria-label="编辑小组">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                      </svg>
                    </button>
                    <button class="btn btn--icon is-danger" type="button" aria-label="删除小组">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                      </svg>
                    </button>
                  </div>
                </article>
              </div>
            </div>
          </section>

          <!-- 右侧：快捷入口 -->
          <section class="card" aria-labelledby="quick-title">
            <div class="card__header">
              <h2 class="card__title" id="quick-title">快捷入口</h2>
            </div>
            <div class="card__body">
              <nav class="quick-list" aria-label="快捷操作">
                <a class="quick-item" href="#">
                  <span class="quick-item__icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="17 8 12 3 7 8"/>
                      <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                  </span>
                  批量导入个案
                </a>
                <a class="quick-item" href="#">
                  <span class="quick-item__icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="7 10 12 15 17 10"/>
                      <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                  </span>
                  导出个案档案
                </a>
              </nav>
            </div>
          </section>
        </div>

        <!-- 个案列表 -->
        <section class="card table-card" aria-labelledby="case-title">
          <div class="card__header">
            <h2 class="card__title" id="case-title">个案基本情况</h2>
          </div>
          <div class="card__body case-table-wrapper">
            <table class="table case-table">
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>性别</th>
                  <th>出生年月</th>
                  <th>年龄</th>
                  <th>上课形式</th>
                  <th>备注</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="case-name">
                      <div class="avatar" aria-hidden="true">张</div>
                      <span class="case-name__text">张柏霖</span>
                    </div>
                  </td>
                  <td>男</td>
                  <td class="text-muted">2018-03</td>
                  <td class="text-muted">8 岁</td>
                  <td><span class="tag tag--primary">1 对 1</span></td>
                  <td class="text-muted">注意力训练</td>
                  <td>
                    <div class="table__actions">
                      <a class="table__action" href="#">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                          <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        档案
                      </a>
                      <button class="btn btn--icon" type="button" aria-label="编辑">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                      </button>
                      <button class="btn btn--icon is-danger" type="button" aria-label="删除">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <polyline points="3 6 5 6 21 6"/>
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="case-name">
                      <div class="avatar" aria-hidden="true">李</div>
                      <span class="case-name__text">李沐晴</span>
                    </div>
                  </td>
                  <td>女</td>
                  <td class="text-muted">2017-07</td>
                  <td class="text-muted">9 岁</td>
                  <td><span class="tag tag--primary">1 对 1</span></td>
                  <td class="text-muted">阅读障碍干预</td>
                  <td>
                    <div class="table__actions">
                      <a class="table__action" href="#">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                          <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        档案
                      </a>
                      <button class="btn btn--icon" type="button" aria-label="编辑">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                      </button>
                      <button class="btn btn--icon is-danger" type="button" aria-label="删除">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <polyline points="3 6 5 6 21 6"/>
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
